<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ciclo — Piano alimentare</title>
<meta name="theme-color" content="#16261F">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ciclo">
<link id="mf" rel="manifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F2F5F0;
  --card:#FFFFFF;
  --ink:#16261F;
  --ink-2:#5A6B62;
  --ink-3:#93A29A;
  --line:#DFE6DE;
  --basil:#2F6B4F;
  --basil-soft:#E6F0E9;
  --saffron:#E0A32E;
  --saffron-soft:#FBF0D8;
  --plum:#7B3560;
  --plum-soft:#F4E7EF;
  --display:'Familjen Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;
  --body:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace;
  --r:14px;
  --nav-h:64px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--paper);color:var(--ink);
  font-family:var(--body);font-size:15px;line-height:1.5;
  padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom));
  overscroll-behavior-y:none;
}
h1,h2,h3,h4{font-family:var(--display);margin:0;letter-spacing:-.015em;line-height:1.15}
button{font-family:inherit;font-size:inherit;color:inherit;border:0;background:none;cursor:pointer}
input{font-family:inherit;font-size:inherit;color:inherit}

/* ── header ─────────────────────────── */
.top{
  position:sticky;top:0;z-index:20;background:var(--ink);color:#F2F5F0;
  padding:calc(14px + env(safe-area-inset-top)) 18px 14px;
}
.top-row{display:flex;align-items:center;gap:14px}
.eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#8FA89B}
.top h1{font-size:21px;font-weight:600;margin-top:2px}
.top .sub{font-size:12.5px;color:#A8BCB0;margin-top:3px}

/* signature: the 28-day cycle ring */
.ring{width:62px;height:62px;flex:0 0 62px}
.ring .track{stroke:#2B4038;stroke-width:5;fill:none}
.ring .seg{stroke-width:5;fill:none;stroke-linecap:butt}
.ring .done{stroke:#3E6B58}
.ring .cook{stroke:var(--saffron)}
.ring .now{stroke:#F2F5F0}
.ring text{font-family:var(--mono);font-size:15px;font-weight:700;fill:#F2F5F0}
.ring tspan.sm{font-size:7px;fill:#8FA89B}

/* ── layout ─────────────────────────── */
.view{display:none;padding:18px 16px 28px;max-width:640px;margin:0 auto}
.view.on{display:block;animation:in .22s ease}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.sec-label{
  font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--ink-3);margin:26px 0 10px;display:flex;align-items:center;gap:10px;
}
.sec-label::after{content:"";flex:1;height:1px;background:var(--line)}
.view > .sec-label:first-child{margin-top:0}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.card + .card{margin-top:10px}

/* ── meal cards ─────────────────────── */
.meal{width:100%;text-align:left;display:block;background:var(--card);border:1px solid var(--line);
  border-radius:var(--r);padding:15px 16px;margin-bottom:10px;transition:border-color .15s,transform .1s}
.meal:active{transform:scale(.99)}
.meal:hover{border-color:#C5D3C8}
.meal-top{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.meal-slot{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--basil)}
.meal-kcal{font-family:var(--mono);font-size:11px;color:var(--ink-3)}
.meal h3{font-size:17px;font-weight:600;margin-top:6px}
.meal .ing{font-size:13px;color:var(--ink-2);margin-top:6px}
.meal .go{font-size:12px;color:var(--basil);font-weight:600;margin-top:9px;display:inline-flex;align-items:center;gap:5px}

.meal.free{background:var(--plum-soft);border-color:#E4CEDC}
.meal.free .meal-slot{color:var(--plum)}
.meal.free h3{color:var(--plum)}

.pill{display:inline-block;font-family:var(--mono);font-size:10px;letter-spacing:.1em;
  text-transform:uppercase;padding:3px 8px;border-radius:20px;background:var(--basil-soft);color:var(--basil)}

/* cook-today banner */
.cook-note{background:var(--saffron-soft);border:1px solid #EDDCB4;border-radius:var(--r);padding:14px 16px;margin-bottom:14px}
.cook-note .h{font-family:var(--display);font-weight:600;font-size:15px;display:flex;align-items:center;gap:8px}
.cook-note p{margin:6px 0 0;font-size:13.5px;color:#7A5F1E}

/* breakfast switcher */
.bfast{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:15px 16px;margin-bottom:10px}
.bfast-opts{display:flex;gap:6px;margin-top:12px}
.bopt{flex:1;border:1px solid var(--line);border-radius:9px;padding:7px 4px;text-align:center;
  font-family:var(--mono);font-size:11px;color:var(--ink-3);transition:.15s}
.bopt.on{background:var(--ink);border-color:var(--ink);color:#F2F5F0}

/* ── recipe detail ──────────────────── */
.sheet{position:fixed;inset:0;z-index:40;background:var(--paper);overflow-y:auto;display:none;
  padding-bottom:calc(40px + env(safe-area-inset-bottom))}
.sheet.on{display:block;animation:up .25s cubic-bezier(.2,.8,.3,1)}
@keyframes up{from{transform:translateY(18px);opacity:0}to{transform:none;opacity:1}}
.sheet-bar{position:sticky;top:0;background:var(--paper);border-bottom:1px solid var(--line);
  padding:calc(12px + env(safe-area-inset-top)) 16px 12px;display:flex;align-items:center;gap:12px;z-index:2}
.sheet-bar button{font-size:14px;font-weight:600;color:var(--basil);display:flex;align-items:center;gap:6px}
.sheet-body{padding:20px 16px 0;max-width:640px;margin:0 auto}
.sheet-body h2{font-size:24px;font-weight:700;line-height:1.12}
.rmeta{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.rmeta span{font-family:var(--mono);font-size:11px;padding:4px 9px;border-radius:20px;
  background:var(--basil-soft);color:var(--basil)}

.ilist{list-style:none;margin:0;padding:0}
.ilist li{display:flex;justify-content:space-between;gap:14px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.ilist li:last-child{border-bottom:0}
.ilist b{font-family:var(--mono);font-weight:700;font-size:13px;white-space:nowrap}
.ilist .free-txt{color:var(--ink-3);font-size:13px;font-style:italic}

.steps{counter-reset:s;list-style:none;margin:0;padding:0}
.steps li{counter-increment:s;position:relative;padding:0 0 20px 40px}
.steps li::before{content:counter(s,decimal-leading-zero);position:absolute;left:0;top:1px;
  font-family:var(--mono);font-size:12px;font-weight:700;color:var(--basil);
  background:var(--basil-soft);width:26px;height:26px;border-radius:50%;
  display:flex;align-items:center;justify-content:center}
.steps li::after{content:"";position:absolute;left:13px;top:31px;bottom:4px;width:1px;background:var(--line)}
.steps li:last-child{padding-bottom:0}
.steps li:last-child::after{display:none}
.steps h4{font-size:14.5px;font-weight:600;margin-bottom:3px}
.steps p{margin:0;font-size:14px;color:var(--ink-2)}

.warn{background:#FDF6E6;border-left:3px solid var(--saffron);border-radius:0 9px 9px 0;
  padding:12px 14px;margin-top:10px;font-size:13.5px;color:#7A5F1E}
.keep{background:var(--basil-soft);border-radius:var(--r);padding:14px 16px;margin-top:8px;font-size:13.5px;color:#255440}
.keep b{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.14em;
  text-transform:uppercase;margin-bottom:5px;font-weight:700}

/* ── plan view ──────────────────────── */
.wk{display:flex;gap:6px;margin-bottom:16px}
.wtab{flex:1;padding:9px 0;border:1px solid var(--line);border-radius:10px;background:var(--card);
  text-align:center;font-family:var(--mono);font-size:11px;color:var(--ink-2);transition:.15s}
.wtab.on{background:var(--ink);border-color:var(--ink);color:#F2F5F0}
.day-row{display:flex;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}
.day-row:last-child{border-bottom:0}
.dtag{flex:0 0 34px;font-family:var(--mono);font-size:11px;font-weight:700;color:var(--ink-3);padding-top:2px}
.dtag.cooking{color:var(--saffron)}
.day-body{flex:1;min-width:0}
.dline{font-size:13.5px;padding:2px 0;display:flex;gap:8px}
.dline i{font-family:var(--mono);font-style:normal;font-size:10px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink-3);flex:0 0 42px;padding-top:3px}
.dline span{color:var(--ink)}
.dline button{text-align:left;color:var(--ink);text-decoration:underline;text-decoration-color:var(--line);
  text-underline-offset:3px}
.dline .lib{color:var(--plum);font-weight:600}

/* ── recipes index ──────────────────── */
.rlink{width:100%;text-align:left;display:flex;justify-content:space-between;align-items:center;gap:12px;
  padding:14px 0;border-bottom:1px solid var(--line)}
.rlink:last-child{border-bottom:0}
.rlink h4{font-size:15px;font-weight:600}
.rlink p{margin:2px 0 0;font-size:12.5px;color:var(--ink-3);font-family:var(--mono)}
.rlink svg{flex:0 0 16px;color:var(--ink-3)}

/* ── pantry ─────────────────────────── */
.scope{display:flex;gap:6px;margin-bottom:6px}
.sbtn{flex:1;padding:9px 4px;border:1px solid var(--line);border-radius:10px;background:var(--card);
  font-family:var(--mono);font-size:10.5px;color:var(--ink-2);text-align:center;transition:.15s}
.sbtn.on{background:var(--basil);border-color:var(--basil);color:#fff}

.buy{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.buy-head{background:var(--ink);color:#F2F5F0;padding:14px 16px;display:flex;justify-content:space-between;align-items:center}
.buy-head h3{font-size:15px;font-weight:600}
.buy-head span{font-family:var(--mono);font-size:11px;color:#8FA89B}
.buy-cat{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink-3);padding:12px 16px 4px;background:var(--paper)}
.buy-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 16px;border-top:1px solid var(--line)}
.buy-row .nm{font-size:14px}
.buy-row .qt{font-family:var(--mono);font-size:13px;font-weight:700;color:var(--saffron);white-space:nowrap}
.ok-state{padding:26px 16px;text-align:center;color:var(--ink-2);font-size:14px}
.ok-state b{display:block;font-family:var(--display);font-size:16px;color:var(--basil);margin-bottom:4px}

.pan-cat{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink-3);margin:20px 0 6px}
.pan-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.pan-row .nm{flex:1;font-size:14px;min-width:0}
.pan-row .need{font-family:var(--mono);font-size:11px;color:var(--ink-3);white-space:nowrap}
.pan-row input{width:74px;padding:7px 8px;border:1px solid var(--line);border-radius:9px;
  background:var(--card);text-align:right;font-family:var(--mono);font-size:13px}
.pan-row input:focus{outline:2px solid var(--basil);outline-offset:-1px;border-color:var(--basil)}
.pan-row .u{font-family:var(--mono);font-size:11px;color:var(--ink-3);width:22px}

.ghost{width:100%;padding:12px;border:1px solid var(--line);border-radius:11px;background:var(--card);
  font-size:13.5px;font-weight:600;color:var(--ink-2);margin-top:16px}
.ghost:active{background:var(--paper)}

/* ── settings / notes ───────────────── */
.kv{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:11px 0;border-bottom:1px solid var(--line)}
.kv:last-child{border-bottom:0}
.kv .k{font-size:14px}
.kv .k small{display:block;color:var(--ink-3);font-size:12px;margin-top:2px}
.kv input[type=date]{padding:7px 9px;border:1px solid var(--line);border-radius:9px;background:var(--card);font-family:var(--mono);font-size:12.5px}
.kv b{font-family:var(--mono);font-size:14px;font-weight:700}
.note{font-size:12.5px;color:var(--ink-2);line-height:1.55}
.note + .note{margin-top:9px}

/* ── bottom nav ─────────────────────── */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);
  border-top:1px solid var(--line);display:flex;
  padding-bottom:env(safe-area-inset-bottom);height:calc(var(--nav-h) + env(safe-area-inset-bottom))}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  color:var(--ink-3);height:var(--nav-h)}
.nav button.on{color:var(--basil)}
.nav svg{width:21px;height:21px}
.nav span{font-family:var(--mono);font-size:9.5px;letter-spacing:.06em}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<header class="top">
  <div class="top-row">
    <svg class="ring" viewBox="0 0 100 100" id="ring" aria-hidden="true"></svg>
    <div style="min-width:0">
      <div class="eyebrow" id="hEyebrow">Ciclo 28 giorni</div>
      <h1 id="hTitle">—</h1>
      <div class="sub" id="hSub">—</div>
    </div>
  </div>
</header>

<main>
  <section class="view on" id="v-oggi"></section>
  <section class="view" id="v-piano"></section>
  <section class="view" id="v-ricette"></section>
  <section class="view" id="v-dispensa"></section>
</main>

<div class="sheet" id="sheet">
  <div class="sheet-bar">
    <button onclick="closeSheet()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      Indietro
    </button>
  </div>
  <div class="sheet-body" id="sheetBody"></div>
</div>

<nav class="nav" id="nav"></nav>

<script>
/* ══════════════════════════════════════════════════════════
   1. INGREDIENTI
   ══════════════════════════════════════════════════════════ */
const ING = {
  latte:      {n:'Latte parz. scremato',            u:'ml', c:'Latticini', k:46,  p:3.3, ca:4.9, g:1.6},
  yogurt:     {n:'Yogurt greco magro 0%',           u:'g',  c:'Latticini', k:57,  p:10,  ca:4,   g:0.4},
  grana:      {n:'Grana / Parmigiano',              u:'g',  c:'Latticini', k:392, p:33,  ca:0,   g:28},
  filante:    {n:'Formaggio filante (provola)',     u:'g',  c:'Latticini', k:320, p:25,  ca:2,   g:24},
  uova:       {n:'Uova',                            u:'pz', c:'Proteine',  k:78,  p:6.3, ca:0.4, g:5.3, pz:1},
  tacchino:   {n:'Petto di tacchino a fette',       u:'g',  c:'Proteine',  k:107, p:24,  ca:0,   g:1},
  nasello:    {n:'Filetti di nasello / merluzzo',   u:'g',  c:'Proteine',  k:86,  p:17,  ca:0,   g:2},
  tonno:      {n:'Tonno al naturale (sgocciolato)', u:'g',  c:'Proteine',  k:116, p:26,  ca:0,   g:1},
  ceci:       {n:'Ceci precotti',                   u:'g',  c:'Legumi',    k:120, p:7,   ca:17,  g:2.5},
  lenticchie: {n:'Lenticchie precotte',             u:'g',  c:'Legumi',    k:105, p:8,   ca:15,  g:0.5},
  pasta_int:  {n:'Pasta integrale',                 u:'g',  c:'Cereali',   k:340, p:13,  ca:64,  g:2.5},
  pasta:      {n:'Pasta',                           u:'g',  c:'Cereali',   k:355, p:12,  ca:72,  g:1.5},
  riso:       {n:'Riso',                            u:'g',  c:'Cereali',   k:340, p:7,   ca:78,  g:0.6},
  pane:       {n:'Pane',                            u:'g',  c:'Cereali',   k:265, p:8.5, ca:50,  g:1.5},
  biscotti:   {n:'Biscotti secchi',                 u:'g',  c:'Colazione', k:430, p:7,   ca:75,  g:11},
  fette:      {n:'Fette biscottate',                u:'g',  c:'Colazione', k:400, p:11,  ca:75,  g:6},
  granola:    {n:'Granola / cereali',               u:'g',  c:'Colazione', k:430, p:9,   ca:65,  g:14},
  avena:      {n:"Fiocchi d'avena",                 u:'g',  c:'Colazione', k:375, p:13,  ca:60,  g:7},
  miele:      {n:'Miele',                           u:'g',  c:'Colazione', k:300, p:0,   ca:80,  g:0},
  marmell:    {n:'Marmellata',                      u:'g',  c:'Colazione', k:250, p:0,   ca:60,  g:0},
  zucchine:   {n:'Zucchine',                        u:'g',  c:'Verdura',   k:17,  p:1.3, ca:2,   g:0.3},
  spinaci:    {n:'Spinaci',                         u:'g',  c:'Verdura',   k:23,  p:2.9, ca:1,   g:0.4},
  insalata:   {n:'Insalata',                        u:'g',  c:'Verdura',   k:15,  p:1.4, ca:1.5, g:0.2},
  patate:     {n:'Patate',                          u:'g',  c:'Verdura',   k:77,  p:2,   ca:17,  g:0.1},
  funghi:     {n:'Funghi champignon',               u:'g',  c:'Verdura',   k:22,  p:3,   ca:1,   g:0.3},
  frutta:     {n:'Frutta (media, ~150 g)',          u:'pz', c:'Verdura',   k:90,  p:1,   ca:20,  g:0.3, pz:1},
  passata:    {n:'Passata di pomodoro',             u:'g',  c:'Dispensa',  k:32,  p:1.5, ca:6,   g:0.2},
  pesto:      {n:'Pesto',                           u:'g',  c:'Dispensa',  k:450, p:6,   ca:6,   g:45},
  olio:       {n:'Olio EVO',                        u:'g',  c:'Dispensa',  k:900, p:0,   ca:0,   g:100}
};
/* calcolo nutrizionale reale a partire dagli ingredienti */
function nutri(ing){
  let o={kcal:0,p:0,c:0,g:0};
  for(const key in ing){
    const n=ING[key]; if(!n) continue;
    const f = n.pz ? ing[key] : ing[key]/100;
    o.kcal+=n.k*f; o.p+=n.p*f; o.c+=n.ca*f; o.g+=n.g*f;
  }
  for(const k in o) o[k]=Math.round(o[k]);
  return o;
}
const CATS = ['Proteine','Latticini','Legumi','Cereali','Verdura','Colazione','Dispensa'];

/* ══════════════════════════════════════════════════════════
   2. RICETTE  (ingredienti = 1 porzione)
   ══════════════════════════════════════════════════════════ */
const R = {

pasta_zuc_uovo:{
  nome:'Pasta con zucchine e uova', tempo:20, porz:3,
  ing:{pasta_int:130, zucchine:200, uova:2, grana:38, olio:11},
  libere:["½ spicchio d'aglio","Sale, pepe nero"],
  passi:[
    {t:'Metti su l\'acqua', d:'Un litro d\'acqua ogni 100 g di pasta. Sala solo quando bolle: prima allunga i tempi di ebollizione.'},
    {t:'Taglia le zucchine', d:'A rondelle sottili, 3–4 mm. Più sono sottili, più in fretta si dorano invece di lessare.'},
    {t:'Insaporisci l\'olio', d:'Scalda l\'olio in padella con lo spicchio d\'aglio schiacciato. Quando sfrigola togli l\'aglio, ha già ceduto il sapore.'},
    {t:'Rosola le zucchine', d:'8–10 minuti a fuoco medio con un pizzico di sale, finché sono dorate ai bordi ma ancora sode. Se si asciugano, due cucchiai di acqua di cottura.'},
    {t:'Cuoci la pasta', d:'Al dente, un minuto in meno rispetto alla confezione: finisce di cuocere in padella.'},
    {t:'Prepara la crema', d:'In una ciotola sbatti le due uova con il grana grattugiato e una macinata di pepe.'},
    {t:'Manteca a fuoco spento', d:'Scola la pasta tenendo un mestolo di acqua di cottura, versala sulle zucchine, spegni il fuoco. Aggiungi uova e grana e mescola senza fermarti: il calore residuo crea una crema. Allunga con l\'acqua se serve.'}

   5. STORAGE  (window.storage in Claude · localStorage da file · memoria)
   ══════════════════════════════════════════════════════════ */
const mem = {};
const Store = {
  async get(k){
    if(window.storage){
      try{ const r = await window.storage.get(k, false); if(r&&r.value) return JSON.parse(r.value); }catch(e){}
    }
    try{ const v = localStorage.getItem('ciclo:'+k); if(v) return JSON.parse(v); }catch(e){}
    return mem[k] ?? null;
  },
  async set(k,v){
    mem[k]=v;
    if(window.storage){
      try{ await window.storage.set(k, JSON.stringify(v), false); return; }catch(e){}
    }
    try{ localStorage.setItem('ciclo:'+k, JSON.stringify(v)); }catch(e){}
  }
};

   6. STATO

let S = { start:null, pantry:{}, scope:'cur', planWeek:0, bfast:{} };

function mondayOf(d){
  const x = new Date(d); x.setHours(0,0,0,0);
  x.setDate(x.getDate() - ((x.getDay()+6)%7));
  return x;
}
function iso(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }

function pos(){
  const today = new Date(); today.setHours(0,0,0,0);
  const start = mondayOf(S.start ? new Date(S.start+'T00:00:00') : today);
  const days  = Math.floor((today - start)/86400000);
  const n     = ((days % 28) + 28) % 28;
  return { w: Math.floor(n/7), d: n%7, abs:n, past: days < 0 };
}

   ══════════════════════════════════════════════════════════ */
function weekNeeds(wi){
  const w = WEEKS[wi], out = {};
  const add = (ing, mult=1) => { for(const k in ing) out[k] = (out[k]||0) + ing[k]*mult; };

  for(let d=0; d<7; d++) add(B[w.col[d%3]].ing);          // colazioni a rotazione

  w.bl.forEach(b=>{
    add(R[b.pranzo].ing, b.gg.length);                     // pranzi
    const cene = b.gg.filter(g => g !== FREE_DAY).length;  // cene, sabato escluso
    add(R[b.cena].ing, cene);
  });
  return out;
}
function scopeNeeds(){
  const p = pos();
  if(S.scope==='cur')  return weekNeeds(p.w);
  if(S.scope==='next') return weekNeeds((p.w+1)%4);
  const out = {};
  for(let i=0;i<4;i++){ const n=weekNeeds(i); for(const k in n) out[k]=(out[k]||0)+n[k]; }
  return out;
}
function roundBuy(v,u){
  if(u==='pz') return Math.ceil(v);
  if(v<50) return Math.ceil(v/5)*5;
  return Math.ceil(v/10)*10;
}

/* ══════════════════════════════════════════════════════════
   8. HEADER + ANELLO DEL CICLO
   ══════════════════════════════════════════════════════════ */
function drawRing(){
  const p = pos(), el = document.getElementById('ring');
  const cx=50, cy=50, r=41, N=28, gap=2.6, step=360/N;
  const arc = (i,cls) => {
    const a0 = -90 + i*step + gap/2, a1 = -90 + (i+1)*step - gap/2;
    const rad = a => (a*Math.PI)/180;
    const x0 = cx + r*Math.cos(rad(a0)), y0 = cy + r*Math.sin(rad(a0));
    const x1 = cx + r*Math.cos(rad(a1)), y1 = cy + r*Math.sin(rad(a1));
    return `<path class="seg ${cls}" d="M${x0.toFixed(2)} ${y0.toFixed(2)} A${r} ${r} 0 0 1 ${x1.toFixed(2)} ${y1.toFixed(2)}"/>`;
  };
  let s = `<circle class="track" cx="50" cy="50" r="41"/>`;
  for(let i=0;i<N;i++){
    const day = i%7;
    let cls = '';
    if(i === p.abs) cls = 'now';
    else if(i < p.abs) cls = 'done';
    else if(PREP_DAYS[day]) cls = 'cook';
    if(cls) s += arc(i,cls);
  }
  s += `<text x="50" y="47" text-anchor="middle">${p.abs+1}</text>`;
  s += `<text x="50" y="59" text-anchor="middle"><tspan class="sm">DI 28</tspan></text>`;
  el.innerHTML = s;
}
function drawHeader(){
  const p = pos(), w = WEEKS[p.w];
  const dt = new Date(); 
  document.getElementById('hEyebrow').textContent = `Settimana ${w.n} · ${w.tema}`;
  document.getElementById('hTitle').textContent   = GG[p.d];
  document.getElementById('hSub').textContent     = dt.toLocaleDateString('it-IT',{day:'numeric',month:'long'});
  drawRing();
}

function blockOf(w,d){ return w.bl.find(b => b.gg.includes(d)); }

function ingLine(r){
  return Object.entries(r.ing).map(([k,v]) => `${ING[k].n.split(' (')[0].toLowerCase()} ${v}${ING[k].u==='pz'?'':' '+ING[k].u}`).join(' · ');
}

function renderOggi(){
  const p = pos(), w = WEEKS[p.w], b = blockOf(w,p.d);
  const isFree = p.d === FREE_DAY;
  const bKey = S.bfast[p.abs] ?? (p.d % 3);
  const col = B[w.col[bKey]];
  const pr = R[b.pranzo], ce = R[b.cena];
  const nC = nutri(col.ing), nP = nutri(pr.ing), nE = isFree ? {kcal:0,p:0,c:0,g:0} : nutri(ce.ing);
  const tot = {kcal:nC.kcal+nP.kcal+nE.kcal, p:nC.p+nP.p+nE.p, c:nC.c+nP.c+nE.c, g:nC.g+nP.g+nE.g};

  let h = '';

  if(PREP_DAYS[p.d]){
    const nb = w.bl.find(x=>x.id===PREP_DAYS[p.d]);
    const nPr = nb.gg.length;
    const nCe = nb.gg.filter(g=>g!==FREE_DAY).length;
    h += `<div class="cook-note">
      <div class="h">Oggi si cucina — blocco ${nb.id}</div>
      <p>${nPr} porzioni di <b>${R[nb.pranzo].nome}</b> e ${nCe} di <b>${R[nb.cena].nome}</b>. Copri fino a ${GG[nb.gg[nb.gg.length-1]].toLowerCase()}.</p>
    </div>`;
  }

  h += `<div class="bfast">
    <div class="meal-top"><span class="meal-slot">Colazione</span><span class="meal-kcal">${nC.kcal} kcal</span></div>
    <h3 style="font-family:var(--display);font-size:17px;font-weight:600;margin-top:6px">${col.nome}</h3>
    <div class="ing">${Object.entries(col.ing).map(([k,v])=>`${ING[k].n.split(' (')[0].toLowerCase()} ${v}${ING[k].u==='pz'?'':' '+ING[k].u}`).join(' · ')}</div>
    <div class="bfast-opts">
      ${w.col.map((c,i)=>`<button class="bopt ${i===bKey?'on':''}" onclick="pickB(${i})">${B[c].nome.split(' ')[0]}</button>`).join('')}
    </div>
  </div>`;

  h += mealCard('Pranzo', b.pranzo);
  h += isFree
    ? `<div class="meal free">
         <div class="meal-top"><span class="meal-slot">Cena · sabato</span><span class="meal-kcal">—</span></div>
         <h3>Cena libera</h3>
         <div class="ing" style="color:#7B3560;opacity:.85">Mangia quello che vuoi, senza pesare niente. Se ti va, alleggerisci di 10–15 g pane o pasta a pranzo.</div>
       </div>`
    : mealCard('Cena', b.cena);

  h += `<div class="sec-label">Totale della giornata</div>
    <div class="card">
      <div class="kv"><span class="k">Calorie${isFree?' <small>la cena libera non è conteggiata</small>':''}</span><b>${tot.kcal} kcal</b></div>
      <div class="kv"><span class="k">Proteine</span><b>${tot.p} g</b></div>
      <div class="kv"><span class="k">Carboidrati</span><b>${tot.c} g</b></div>
      <div class="kv"><span class="k">Grassi</span><b>${tot.g} g</b></div>
      <div class="kv"><span class="k">Acqua<small>almeno, di più nei giorni di nuoto</small></span><b>2 L</b></div>
    </div>`;

  document.getElementById('v-oggi').innerHTML = h;
}

function mealCard(slot, key){
  const r = R[key];
  return `<button class="meal" onclick="openR('${key}')">
    <div class="meal-top"><span class="meal-slot">${slot}</span><span class="meal-kcal">${nutri(r.ing).kcal} kcal · ${r.tempo} min</span></div>
    <h3>${r.nome}</h3>
    <div class="ing">${ingLine(r)}</div>
    <span class="go">Come si prepara
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
    </span>
  </button>`;
}
function pickB(i){ const p=pos(); S.bfast[p.abs]=i; Store.set('bfast',S.bfast); renderOggi(); }

  h += `<div class="sec-label">Su cosa è calcolato</div>
  <div class="card">

    <div class="kv"><span class="k">Carboidrati</span><b>~280 g</b></div>
    <div class="kv"><span class="k">Grassi</span><b>~70 g</b></div>
    <div class="kv"><span class="k">Deficit stimato<small>perdita attesa 0,5–0,7 kg a settimana</small></span><b>~500 kcal</b></div>
  </div>`;

  h += `<div class="sec-label">Come tarare il piano</div>
  <div class="card">

  </div>`;

  document.getElementById('v-piano').innerHTML = h;
}
function setWeek(i){ S.planWeek=i; renderPiano(); }

  (r.libere||[]).forEach(x => h += `<li><span class="free-txt">${x}</span><b class="free-txt">q.b.</b></li>`);

/* ══════════════════════════════════════════════════════════
   13. VISTA — DISPENSA E SPESA
   ══════════════════════════════════════════════════════════ */
function renderDispensa(){
  const needs = scopeNeeds();
  const labels = {cur:'Questa settimana', next:'La prossima', all:'Tutte e 4'};

  let h = `<div class="sec-label">Calcola per</div>
  <div class="scope">${['cur','next','all'].map(s=>
    `<button class="sbtn ${S.scope===s?'on':''}" onclick="setScope('${s}')">${labels[s].toUpperCase()}</button>`).join('')}</div>`;

  // lista della spesa
  const missing = [];
  for(const k in needs){
    const have = S.pantry[k] || 0;
    const gap  = needs[k] - have;
    if(gap > 0.001) missing.push([k, roundBuy(gap, ING[k].u)]);
  }

  h += `<div class="sec-label">Da comprare</div><div class="buy">
    <div class="buy-head"><h3>Lista della spesa</h3><span>${missing.length} VOCI</span></div>`;
  if(!missing.length){
    h += `<div class="ok-state"><b>Dispensa a posto</b>Hai già tutto quello che serve per ${labels[S.scope].toLowerCase()}.</div>`;
  }else{
    CATS.forEach(c=>{
      const rows = missing.filter(([k])=>ING[k].c===c);
      if(!rows.length) return;
      h += `<div class="buy-cat">${c}</div>`;
      rows.forEach(([k,q]) => h += `<div class="buy-row">
        <span class="nm">${ING[k].n}</span><span class="qt">${q} ${ING[k].u}</span></div>`);
    });
  }
  h += `</div>`;

  // dispensa
  h += `<div class="sec-label">Cosa hai in casa</div>
  <div class="card"><p class="note" style="margin-bottom:4px">Scrivi le quantità che hai già. La lista qui sopra si aggiorna da sola sottraendole al fabbisogno.</p></div>`;

  CATS.forEach(c=>{
    const keys = Object.keys(ING).filter(k=>ING[k].c===c && needs[k]);
    if(!keys.length) return;
    h += `<div class="pan-cat">${c}</div><div class="card" style="padding:4px 16px">`;
    keys.forEach(k=>{
      h += `<div class="pan-row">
        <span class="nm">${ING[k].n}<br><span class="need">serve ${Math.round(needs[k])} ${ING[k].u}</span></span>
        <input type="number" inputmode="decimal" min="0" step="any" value="${S.pantry[k] ?? ''}"
               placeholder="0" oninput="setPan('${k}',this.value)" aria-label="${ING[k].n}">
        <span class="u">${ING[k].u}</span>
      </div>`;
    });
    h += `</div>`;
  });

  h += `<button class="ghost" onclick="clearPan()">Azzera la dispensa</button>`;

  document.getElementById('v-dispensa').innerHTML = h;
}
function setScope(s){ S.scope=s; Store.set('scope',s); renderDispensa(); }

let panTimer;
function setPan(k,v){
  const n = parseFloat(v);
  if(v==='' || isNaN(n)) delete S.pantry[k]; else S.pantry[k]=Math.max(0,n);
  Store.set('pantry', S.pantry);
  clearTimeout(panTimer);
  panTimer = setTimeout(()=>{                       // aggiorna solo la lista, senza perdere il focus
    const needs = scopeNeeds(); const missing=[];
    for(const key in needs){ const g = needs[key]-(S.pantry[key]||0); if(g>0.001) missing.push([key,roundBuy(g,ING[key].u)]); }
    const box = document.querySelector('.buy'); if(!box) return;
    let inner = `<div class="buy-head"><h3>Lista della spesa</h3><span>${missing.length} VOCI</span></div>`;
    if(!missing.length){
      inner += `<div class="ok-state"><b>Dispensa a posto</b>Hai già tutto quello che serve.</div>`;
    }else{
      CATS.forEach(c=>{
        const rows = missing.filter(([x])=>ING[x].c===c);
        if(!rows.length) return;
        inner += `<div class="buy-cat">${c}</div>`;
        rows.forEach(([x,q]) => inner += `<div class="buy-row"><span class="nm">${ING[x].n}</span><span class="qt">${q} ${ING[x].u}</span></div>`);
      });
    }
    box.innerHTML = inner;
  }, 250);
}
function clearPan(){ S.pantry={}; Store.set('pantry',{}); renderDispensa(); }

  S.bfast  = await Store.get('bfast')  || {};

  drawHeader(); renderOggi(); renderPiano(); renderRicette(); renderDispensa();
})();

document.addEventListener('keydown', e => { if(e.key==='Escape') closeSheet(); });
</script>

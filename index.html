<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Piano Alimentare</title>
<meta name="app-versione" content="3.0.0">
<meta name="theme-color" content="#16261F">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Piano Alimentare">
<meta name="description" content="Piano alimentare ciclico di 3 settimane, una per turno di lavoro: cosa mangiare, come prepararlo e cosa comprare.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Piano Alimentare">
<meta property="og:title" content="Piano Alimentare">
<meta property="og:description" content="Piano ciclico di 3 settimane, una per turno: cosa mangiare oggi, ricette passo passo e lista della spesa.">
<meta property="og:url" content="https://cristian-2005-20.github.io/Dieta/">
<meta property="og:image" content="https://cristian-2005-20.github.io/Dieta/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Piano Alimentare">
<meta name="twitter:description" content="Piano ciclico di 3 settimane, una per turno: cosa mangiare oggi, ricette passo passo e lista della spesa.">
<meta name="twitter:image" content="https://cristian-2005-20.github.io/Dieta/og.png">
<link id="mf" rel="manifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F2F5F0;
  --card:#FFFFFF;
  --ink:#16261F;
  --ink-2:#5A6B62;
  --ink-3:#93A29A;
  --line:#DFE6DE;
  --basil:#2F6B4F;
  --basil-soft:#E6F0E9;
  --saffron:#E0A32E;
  --saffron-soft:#FBF0D8;
  --plum:#7B3560;
  --plum-soft:#F4E7EF;
  --display:'Familjen Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;
  --body:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace;
  --r:14px;
  --nav-h:64px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--paper);color:var(--ink);
  font-family:var(--body);font-size:15px;line-height:1.5;
  padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom));
  overscroll-behavior-y:none;
}
h1,h2,h3,h4{font-family:var(--display);margin:0;letter-spacing:-.015em;line-height:1.15}
button{font-family:inherit;font-size:inherit;color:inherit;border:0;background:none;cursor:pointer}
input{font-family:inherit;font-size:inherit;color:inherit}

/* ── header ─────────────────────────── */
.top{
  position:sticky;top:0;z-index:20;background:var(--ink);color:#F2F5F0;
  padding:calc(14px + env(safe-area-inset-top)) 18px 14px;
}
.top-row{display:flex;align-items:center;gap:14px}
.eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#8FA89B}
.top h1{font-size:21px;font-weight:600;margin-top:2px}
.top .sub{font-size:12.5px;color:#A8BCB0;margin-top:3px}

/* signature: the 21-day ring (three weeks of the cycle) */
.ring{width:62px;height:62px;flex:0 0 62px}
.ring .track{stroke:#2B4038;stroke-width:5;fill:none}
.ring .seg{stroke-width:5;fill:none;stroke-linecap:butt}
.ring .done{stroke:#3E6B58}
.ring .cook{stroke:var(--saffron)}
.ring .now{stroke:#F2F5F0}
.ring text{font-family:var(--mono);font-size:15px;font-weight:700;fill:#F2F5F0}
.ring tspan.sm{font-size:7px;fill:#8FA89B}

/* ── layout ─────────────────────────── */
.view{display:none;padding:18px 16px 28px;max-width:640px;margin:0 auto}
.view.on{display:block;animation:in .22s ease}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.sec-label{
  font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--ink-3);margin:26px 0 10px;display:flex;align-items:center;gap:10px;
}
.sec-label::after{content:"";flex:1;height:1px;background:var(--line)}
.view > .sec-label:first-child{margin-top:0}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.card + .card{margin-top:10px}

/* ── meal cards ─────────────────────── */
.meal{width:100%;text-align:left;display:block;background:var(--card);border:1px solid var(--line);
  border-radius:var(--r);padding:15px 16px;margin-bottom:10px;transition:border-color .15s,transform .1s}
.meal:active{transform:scale(.99)}
.meal:hover{border-color:#C5D3C8}
.meal-top{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.meal-slot{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--basil)}
.meal-kcal{font-family:var(--mono);font-size:11px;color:var(--ink-3)}
.meal h3{font-size:17px;font-weight:600;margin-top:6px}
.meal .ing{font-size:13px;color:var(--ink-2);margin-top:6px}
.meal .eta{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);margin-top:5px;letter-spacing:.02em}
.meal .go{font-size:12px;color:var(--basil);font-weight:600;margin-top:9px;display:inline-flex;align-items:center;gap:5px}

.meal.free{background:var(--plum-soft);border-color:#E4CEDC}
.meal.free .meal-slot{color:var(--plum)}
.meal.free h3{color:var(--plum)}

.pill{display:inline-block;font-family:var(--mono);font-size:10px;letter-spacing:.1em;
  text-transform:uppercase;padding:3px 8px;border-radius:20px;background:var(--basil-soft);color:var(--basil)}

/* cook-today banner */
.cook-note{background:var(--saffron-soft);border:1px solid #EDDCB4;border-radius:var(--r);padding:14px 16px;margin-bottom:14px}
.cook-note .h{font-family:var(--display);font-weight:600;font-size:15px;display:flex;align-items:center;gap:8px}
.cook-note p{margin:6px 0 0;font-size:13.5px;color:#7A5F1E}

/* breakfast switcher */
.bfast{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:15px 16px;margin-bottom:10px}
.bfast-opts{display:flex;gap:6px;margin-top:12px}
.bopt{flex:1;border:1px solid var(--line);border-radius:9px;padding:7px 4px;text-align:center;
  font-family:var(--mono);font-size:11px;color:var(--ink-3);transition:.15s}
.bopt.on{background:var(--ink);border-color:var(--ink);color:#F2F5F0}

/* ── recipe detail ──────────────────── */
.sheet{position:fixed;inset:0;z-index:40;background:var(--paper);overflow-y:auto;display:none;
  padding-bottom:calc(40px + env(safe-area-inset-bottom))}
.sheet.on{display:block;animation:up .25s cubic-bezier(.2,.8,.3,1)}
@keyframes up{from{transform:translateY(18px);opacity:0}to{transform:none;opacity:1}}
.sheet-bar{position:sticky;top:0;background:var(--paper);border-bottom:1px solid var(--line);
  padding:calc(12px + env(safe-area-inset-top)) 16px 12px;display:flex;align-items:center;gap:12px;z-index:2}
.sheet-bar button{font-size:14px;font-weight:600;color:var(--basil);display:flex;align-items:center;gap:6px}
.sheet-body{padding:20px 16px 0;max-width:640px;margin:0 auto}
.sheet-body h2{font-size:24px;font-weight:700;line-height:1.12}
.rmeta{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.rmeta span{font-family:var(--mono);font-size:11px;padding:4px 9px;border-radius:20px;
  background:var(--basil-soft);color:var(--basil)}

.ilist{list-style:none;margin:0;padding:0}
.ilist li{display:flex;justify-content:space-between;gap:14px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.ilist li:last-child{border-bottom:0}
.ilist b{font-family:var(--mono);font-weight:700;font-size:13px;white-space:nowrap}
.ilist .free-txt{color:var(--ink-3);font-size:13px;font-style:italic}

.steps{counter-reset:s;list-style:none;margin:0;padding:0}
.steps li{counter-increment:s;position:relative;padding:0 0 20px 40px}
.steps li::before{content:counter(s,decimal-leading-zero);position:absolute;left:0;top:1px;
  font-family:var(--mono);font-size:12px;font-weight:700;color:var(--basil);
  background:var(--basil-soft);width:26px;height:26px;border-radius:50%;
  display:flex;align-items:center;justify-content:center}
.steps li::after{content:"";position:absolute;left:13px;top:31px;bottom:4px;width:1px;background:var(--line)}
.steps li:last-child{padding-bottom:0}
.steps li:last-child::after{display:none}
.steps h4{font-size:14.5px;font-weight:600;margin-bottom:3px}
.steps p{margin:0;font-size:14px;color:var(--ink-2)}

.warn{background:#FDF6E6;border-left:3px solid var(--saffron);border-radius:0 9px 9px 0;
  padding:12px 14px;margin-top:10px;font-size:13.5px;color:#7A5F1E}
.keep{background:var(--basil-soft);border-radius:var(--r);padding:14px 16px;margin-top:8px;font-size:13.5px;color:#255440}
.keep b{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.14em;
  text-transform:uppercase;margin-bottom:5px;font-weight:700}

/* ── plan view ──────────────────────── */
.wk{display:flex;gap:6px;margin-bottom:16px}
.wtab{flex:1;padding:9px 0;border:1px solid var(--line);border-radius:10px;background:var(--card);
  text-align:center;font-family:var(--mono);font-size:11px;color:var(--ink-2);transition:.15s}
.wtab.on{background:var(--ink);border-color:var(--ink);color:#F2F5F0}
.day-row{display:flex;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}
.day-row:last-child{border-bottom:0}
.dtag{flex:0 0 34px;font-family:var(--mono);font-size:11px;font-weight:700;color:var(--ink-3);padding-top:2px}
.dtag.cooking{color:var(--saffron)}
.day-body{flex:1;min-width:0}
.dline{font-size:13.5px;padding:2px 0;display:flex;gap:8px}
.dline i{font-family:var(--mono);font-style:normal;font-size:10px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink-3);flex:0 0 42px;padding-top:3px}
.dline span{color:var(--ink)}
.dline button{text-align:left;color:var(--ink);text-decoration:underline;text-decoration-color:var(--line);
  text-underline-offset:3px}
.dline .lib{color:var(--plum);font-weight:600}

/* ── recipes index ──────────────────── */
.rlink{width:100%;text-align:left;display:flex;justify-content:space-between;align-items:center;gap:12px;
  padding:14px 0;border-bottom:1px solid var(--line)}
.rlink:last-child{border-bottom:0}
.rlink h4{font-size:15px;font-weight:600}
.rlink p{margin:2px 0 0;font-size:12.5px;color:var(--ink-3);font-family:var(--mono)}
.rlink svg{flex:0 0 16px;color:var(--ink-3)}

/* ── pantry ─────────────────────────── */
.scope{display:flex;gap:6px;margin-bottom:6px}
.sbtn{flex:1;padding:9px 4px;border:1px solid var(--line);border-radius:10px;background:var(--card);
  font-family:var(--mono);font-size:10.5px;color:var(--ink-2);text-align:center;transition:.15s}
.sbtn.on{background:var(--basil);border-color:var(--basil);color:#fff}

.buy{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.buy-head{background:var(--ink);color:#F2F5F0;padding:14px 16px;display:flex;justify-content:space-between;align-items:center}
.buy-head h3{font-size:15px;font-weight:600}
.buy-head span{font-family:var(--mono);font-size:11px;color:#8FA89B}
.buy-cat{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink-3);padding:12px 16px 4px;background:var(--paper)}
.buy-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 16px;border-top:1px solid var(--line)}
.buy-row .nm{font-size:14px}
.buy-row .qt{font-family:var(--mono);font-size:13px;font-weight:700;color:var(--saffron);white-space:nowrap}
.ok-state{padding:26px 16px;text-align:center;color:var(--ink-2);font-size:14px}
.ok-state b{display:block;font-family:var(--display);font-size:16px;color:var(--basil);margin-bottom:4px}

.pan-cat{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink-3);margin:20px 0 6px}
.pan-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.pan-row .nm{flex:1;font-size:14px;min-width:0}
.pan-row .need{font-family:var(--mono);font-size:11px;color:var(--ink-3);white-space:nowrap}
.pan-row input{width:74px;padding:7px 8px;border:1px solid var(--line);border-radius:9px;
  background:var(--card);text-align:right;font-family:var(--mono);font-size:13px}
.pan-row input:focus{outline:2px solid var(--basil);outline-offset:-1px;border-color:var(--basil)}
.pan-row .u{font-family:var(--mono);font-size:11px;color:var(--ink-3);width:22px}

.ghost{width:100%;padding:12px;border:1px solid var(--line);border-radius:11px;background:var(--card);
  font-size:13.5px;font-weight:600;color:var(--ink-2);margin-top:16px}
.ghost:active{background:var(--paper)}

/* ── settings / notes ───────────────── */
.kv{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:11px 0;border-bottom:1px solid var(--line)}
.kv:last-child{border-bottom:0}
.kv .k{font-size:14px}
.kv .k small{display:block;color:var(--ink-3);font-size:12px;margin-top:2px}
.kv input[type=date]{padding:7px 9px;border:1px solid var(--line);border-radius:9px;background:var(--card);font-family:var(--mono);font-size:12.5px}
.kv b{font-family:var(--mono);font-size:14px;font-weight:700}
.note{font-size:12.5px;color:var(--ink-2);line-height:1.55}
.note + .note{margin-top:9px}

/* ── bottom nav ─────────────────────── */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);
  border-top:1px solid var(--line);display:flex;
  padding-bottom:env(safe-area-inset-bottom);height:calc(var(--nav-h) + env(safe-area-inset-bottom))}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  color:var(--ink-3);height:var(--nav-h)}
.nav button.on{color:var(--basil)}
.nav svg{width:21px;height:21px}
.nav span{font-family:var(--mono);font-size:9px;letter-spacing:.03em}

.w-in{display:flex;gap:8px;align-items:stretch}
.w-in input{flex:1;min-width:0;padding:12px;border:1px solid var(--line);border-radius:11px;
  background:var(--card);font-family:var(--mono);font-size:15px}
.w-in input[type=date]{flex:1.1;font-size:13px}
.w-in input:focus{outline:2px solid var(--basil);outline-offset:-1px;border-color:var(--basil)}
.w-add{background:var(--basil);color:#fff;border-radius:11px;padding:0 18px;font-weight:600;font-size:14px}
.w-add:active{background:#255440}

.w-big{display:flex;gap:10px;margin:10px 0 0}
.w-stat{flex:1;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:13px 14px}
.w-stat .lbl{font-family:var(--mono);font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3)}
.w-stat .val{font-family:var(--display);font-size:23px;font-weight:700;margin-top:4px;line-height:1}
.w-stat .sub{font-size:11.5px;color:var(--ink-3);margin-top:3px}
.dn{color:var(--basil)} .up{color:#C4562F}

.chart{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 12px 8px}
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .tgt{stroke:var(--saffron);stroke-width:1.5;stroke-dasharray:5 4}
.chart .ln{fill:none;stroke:var(--basil);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.chart .ar{fill:var(--basil);opacity:.07}
.chart .pt{fill:var(--card);stroke:var(--basil);stroke-width:2}
.chart .lastpt{fill:var(--basil);stroke:var(--card);stroke-width:2.5}
.chart text{font-family:var(--mono);font-size:8.5px;fill:var(--ink-3)}

.wk-row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.wk-row:last-child{border-bottom:0}
.wk-row .per{flex:1;font-size:13.5px}
.wk-row .per small{display:block;color:var(--ink-3);font-size:11px;font-family:var(--mono);margin-top:2px}
.wk-row .med{font-family:var(--mono);font-size:14px;font-weight:700}
.wk-row .dlt{font-family:var(--mono);font-size:12px;width:56px;text-align:right}

.p-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.p-row:last-child{border-bottom:0}
.p-row .dt{flex:1;font-family:var(--mono);font-size:12.5px;color:var(--ink-2)}
.p-row .kg{font-family:var(--mono);font-size:14px;font-weight:700}
.p-row .x{color:var(--ink-3);padding:4px 8px;font-size:16px;line-height:1}

.tdee{background:var(--basil-soft);border-radius:var(--r);padding:16px}
.tdee .lbl{font-family:var(--mono);font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--basil)}
.tdee .val{font-family:var(--display);font-size:27px;font-weight:700;color:#1E4634;margin-top:5px;line-height:1}
.tdee p{margin:8px 0 0;font-size:13px;color:#255440;line-height:1.5}

.exp{width:100%;padding:13px;border-radius:11px;background:var(--ink);color:#F2F5F0;
  font-size:14px;font-weight:600;margin-top:10px;display:flex;align-items:center;justify-content:center;gap:8px}
.exp:active{opacity:.85}
.expbox{width:100%;margin-top:10px;padding:12px;border:1px solid var(--line);border-radius:11px;
  background:var(--card);font-family:var(--mono);font-size:11.5px;line-height:1.5;min-height:150px;resize:vertical}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + 22px + env(safe-area-inset-bottom));
  background:var(--ink);color:#F2F5F0;padding:11px 20px;border-radius:24px;font-size:13.5px;font-weight:600;
  z-index:60;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
.empty{text-align:center;padding:30px 16px;color:var(--ink-3);font-size:14px}
.empty b{display:block;font-family:var(--display);font-size:16px;color:var(--ink-2);margin-bottom:5px}
.chart .ms{stroke:var(--ink-3);stroke-width:1;stroke-dasharray:3 3}
.wk-row .med.par{opacity:.5}
.pre-date{width:100%;margin-top:10px;padding:11px 12px;border:1px solid #EDDCB4;border-radius:11px;background:#fff;font-size:14px;font-family:inherit;color:var(--ink)}

.chip{display:inline-block;font-family:var(--mono);font-size:9.5px;letter-spacing:.04em;padding:2px 7px;border-radius:20px;
  background:var(--paper);color:var(--ink-3);border:1px solid var(--line);vertical-align:middle;font-weight:500;white-space:nowrap}
.chip.on{background:var(--basil-soft);color:var(--basil);border-color:#C5D3C8}
.seg{display:flex;gap:6px;width:116px;flex:0 0 116px}
.seg .bopt{flex:1}
.pan-row .u{width:40px}
.pan-row .need{white-space:normal}
.kv b{white-space:nowrap}
.bfast .eta{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);margin-top:5px;letter-spacing:.02em}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<header class="top">
  <div class="top-row">
    <svg class="ring" viewBox="0 0 100 100" id="ring" aria-hidden="true"></svg>
    <div style="min-width:0">
      <div class="eyebrow" id="hEyebrow">Piano Alimentare</div>
      <h1 id="hTitle">—</h1>
      <div class="sub" id="hSub">—</div>
    </div>
  </div>
</header>

<main>
  <section class="view on" id="v-oggi"></section>
  <section class="view" id="v-piano"></section>
  <section class="view" id="v-ricette"></section>
  <section class="view" id="v-dispensa"></section>
  <section class="view" id="v-peso"></section>
</main>

<div class="sheet" id="sheet">

/* le misure personali (S.conf) sovrascrivono i valori di CONF_DEF; in assenza di S usa i default */
function confVal(key){
  try{ if(typeof S !== 'undefined' && S && S.conf && S.conf[key] != null) return S.conf[key]; }catch(e){}
  return CONF_DEF[key];
}
/* grammi di un'unità «a pezzi» */
function wOf(k){ const n = ING[k]; return n.conf ? confVal(n.conf) : n.w; }
const aPezzi = k => !!(ING[k].conf || ING[k].w);

/* calcolo nutrizionale a partire dagli ingredienti (quantità nell'unità dell'ingrediente) */
function nutri(ing){
  const o = {kcal:0, p:0, c:0, g:0};
  for(const key in ing){
    const n = ING[key]; if(!n) continue;
    const grammi = aPezzi(key) ? ing[key]*wOf(key) : ing[key];
    const f = grammi/100;
    o.kcal += n.k*f; o.p += n.p*f; o.c += n.ca*f; o.g += n.g*f;
  }
  for(const k in o) o[k] = Math.round(o[k]);
  return o;
}
/* quantità leggibile: «65 g», «2 scatolette», «½ vasetto» */
function numIt(q){
  const r = Math.round(q*2)/2;
  if(Math.abs(q-r) < 0.01 && r !== Math.floor(r)) return (Math.floor(r) ? Math.floor(r) : '') + '½';
  return String(Math.round(q*10)/10).replace('.',',');
}
function fmtQ(k, q){
  const n = ING[k];
  if(n.un) return numIt(q) + ' ' + (q === 1 ? n.un[0] : n.un[1]);
  return Math.round(q*10)/10 + ' ' + n.u;
}

    p:['pf_tonno','pasta_pom_pollo','tacc_patate','pasta_zuc_uovo','ragu','frittata_spinaci','insalata_legumi'],
    c:['pasta_pom_pollo','tacc_patate','pasta_zuc_uovo','ragu'],
    cp:'nasello',
    am:['am5','am3','am6','am1','am6','am5','am7'],
    pm:['pm1','pm2','pm3','pm4','pm1','pm3','pm2'] },
  /* ── Turno 8:24 ── */
  { turno:1,
    p:['riso_tonno','riso_pollo','tacc_spi','pasta_legumi','pollo_patate','panino_pollo','piatto_freddo'],
    c:['riso_pollo','tacc_spi','pasta_legumi','pollo_patate'],
    cp:'hamburger',
    am:['am1','am5','am3','am7','am2','am1','am6'],
    pm:['pm3','pm4','pm1','pm2','pm3','pm1','pm4'] },
  /* ── Turno 9:24 ── */
  { turno:2,
    p:['pf_piselli','pasta_tacc_zuc','polpette','pasta_pom_tonno','straccetti','frittata_zuc','pf_cotto'],
    c:['pasta_tacc_zuc','polpette','pasta_pom_tonno','straccetti'],
    cp:'salmone',
    am:['am1','am5','am3','am2','am1','am3','am7'],
    pm:['pw1','pw2','pw3','pw1','pw2','pm1','pm3'] }
];
const GG   = ['Lunedì','Martedì','Mercoledì','Giovedì','Venerdì','Sabato','Domenica'];
const GG_S = ['LUN','MAR','MER','GIO','VEN','SAB','DOM'];
const NUOTO_DEF = [0,2,4];          // nuoto di norma lun-mer-ven; si cambia dalla scheda Oggi
const CENA_PIAN_DEF = 6;            // cena pianificata di default: domenica (ven e sab libere)
/* rotazione dei turni (dato confermato dall'utente l'11/10/2026): la settimana che inizia lunedì 12/10/2026 è il Turno 9:24
   (indice 2), poi 7:00 (0), 8:24 (1), di nuovo 9:24, e così via. Una scelta esplicita (Piano → Calendario dei turni) ha la precedenza. */
const TURNO_ANCORA = {lun:'2026-10-12', turno:2};

/* ══════════════════════════════════════════════════════════
   5. STORAGE  (window.storage in Claude · localStorage da file · memoria)
   ══════════════════════════════════════════════════════════ */
const mem = {};
const Store = {
  async get(k){
    if(window.storage){
      try{ const r = await window.storage.get(k, false); if(r&&r.value) return JSON.parse(r.value); }catch(e){}
    }
    try{ const v = localStorage.getItem('ciclo:'+k); if(v) return JSON.parse(v); }catch(e){}
    return mem[k] ?? null;
  },
  async set(k,v){
    mem[k]=v;
    if(window.storage){
      try{ await window.storage.set(k, JSON.stringify(v), false); return; }catch(e){}
    }
    try{ localStorage.setItem('ciclo:'+k, JSON.stringify(v)); }catch(e){}
  }
};

/* ══════════════════════════════════════════════════════════
   6. STATO
   ══════════════════════════════════════════════════════════ */
let S = { start:null, dieta:null, turni:{}, nuoto:{}, cenaPian:{}, conf:{}, pantry:{}, scope:'cur', planWeek:0, pesi:[] };

function mondayOf(d){
  const x = new Date(d); x.setHours(0,0,0,0);
  x.setDate(x.getDate() - ((x.getDay()+6)%7));
  return x;
}
function iso(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }

/* turno di base (0 = 7:00, 1 = 8:24, 2 = 9:24) di una settimana: la rotazione 7:00 → 8:24 → 9:24 è ancorata alla settimana
   del 12/10/2026 (TURNO_ANCORA), qualunque sia la data di inizio della dieta */
function turnoBase(lun){
  const sett = Math.round((dnum(lun) - dnum(TURNO_ANCORA.lun)) / 7);
  return (((TURNO_ANCORA.turno + sett) % 3) + 3) % 3;
}
/* turno della settimana che inizia il lunedì «lun» (data ISO). Una scelta esplicita (S.turni) vale per quella
   settimana e le settimane dopo seguono la rotazione 7:00 → 8:24 → 9:24 finché non ne trovano un'altra;
   senza scelte vale la rotazione di base. */
function turnoDi(lun){
  let cur = lun, k = 0;
  while(k < 156){
    if(S.turni[cur] !== undefined) return (((S.turni[cur] + k) % 3) + 3) % 3;
    cur = addGiorni(cur, -7); k++;
  }
  return turnoBase(lun);
}

function pos(){
  const today = new Date(); today.setHours(0,0,0,0);
  const t = iso(today);
  // data non impostata, oppure dieta non ancora iniziata: anteprima del primo giorno
  if(!S.dieta || t < S.dieta){
    const d0 = S.dieta ? (new Date(S.dieta+'T00:00:00').getDay()+6)%7 : 0;
    const lun = S.start || iso(mondayOf(today));
    return { lun, w:turnoDi(lun), d:d0, abs:0, pre:true, data:S.dieta || t };
  }
  const lun = iso(mondayOf(today));
  return { lun, w:turnoDi(lun), d:(today.getDay()+6)%7, abs:dnum(t) - dnum(S.dieta), pre:false, data:t };
}

/* ══════════════════════════════════════════════════════════
   7. IL GIORNO, LE PORZIONI E I FABBISOGNI
   ══════════════════════════════════════════════════════════ */
/* la sera pianificata del weekend (4 = venerdì, 5 = sabato, 6 = domenica) della settimana che inizia il lunedì «lun» */
function cenaPianDi(lun){ const v = S.cenaPian[lun]; return (v===4 || v===5 || v===6) ? v : CENA_PIAN_DEF; }
/* nuoto quel giorno? (data ISO e giorno della settimana 0–6) */
function nuotoDi(data, d){ const v = S.nuoto[data]; return v === undefined ? NUOTO_DEF.includes(d) : !!v; }

/* tutto quello che si mangia il giorno d della settimana che inizia il lunedì «lun» */
function giornoPiano(lun, d){
  const w = turnoDi(lun), m = MENU[w];
  const cenaKey = d < 4 ? m.c[d] : (cenaPianDi(lun) === d ? m.cp : null);
  return { w, m, d, pranzo:m.p[d], cena:cenaKey, libera:(cenaKey === null),
           amKey:m.am[d], am:SM[m.am[d]], pmKey:m.pm[d], pm:SP[m.pm[d]] };
}
function sommaNutri(list){
  return list.reduce((a,x)=>({kcal:a.kcal+x.kcal, p:a.p+x.p, c:a.c+x.c, g:a.g+x.g}), {kcal:0,p:0,c:0,g:0});
}
/* totale del giorno; la cena libera entra con la stima CENA_LIBERA (ipotesi dichiarata) */
function nutriGiorno(g){
  return sommaNutri([nutri(colazione().ing), nutri(g.am.ing), nutri(R[g.pranzo].ing), nutri(g.pm.ing),
                     g.libera ? CENA_LIBERA : nutri(R[g.cena].ing)]);
}

/* come si presenta il pranzo del giorno d */
function originePranzo(m, d){
  if(d >= 1 && d <= 4 && m.p[d] === m.c[d-1]) return {tipo:'avanzo', txt:'Avanzo di ieri sera (porzione doppia): scaldalo 2 minuti al microonde'};
  if(d === 0) return R[m.p[0]].freddo
    ? {tipo:'domenica', txt:'Cucinato domenica: si mangia freddo'}
    : {tipo:'domenica', txt:'Cucinato domenica: scaldalo al microonde'};
  return {tipo:'momento', txt:'Si cucina al momento'};
}

/* che cosa si cucina nel giorno d: ricetta, porzioni da fare e per quale pasto */
function cucinaOggi(lun, d){
  const g = giornoPiano(lun, d), m = g.m, out = [];
  if(d >= 5) out.push({key:g.pranzo, porz:1, txt:'Pranzo di oggi'});
  if(g.cena){
    const doppia = d < 4 && m.p[d+1] === g.cena;
    out.push({key:g.cena, porz:doppia ? 2 : 1, txt:doppia ? 'Cena di stasera e pranzo di domani' : 'Cena di stasera'});
  }
  if(d === 6){
    const prox = MENU[turnoDi(addGiorni(lun, 7))];
    out.push({key:prox.p[0], porz:1, txt:'Pranzo di domani (lunedì)' + (prox.turno === 2 ? ': puoi anche prepararlo lunedì mattina' : '')});
  }
  return out;
}

/* orari suggeriti: nel weekend non si lavora, quindi solo le fasce generiche */
function orariGiorno(w, d, nuoto){
  const t = TURNI[w];
  if(d >= 5) return { col:'quando ti alzi', am:'a metà mattina', pr:'a pranzo', pm:'nel pomeriggio', ce:nuoto ? '21:30 dopo il nuoto' : '19:15' };
  return { col:t.colazione,
           am:`${t.am} · ${t.amDove}`,
           pr:`${t.pranzo} · a casa`,
           pm:nuoto ? (t.pmDove === 'al lavoro' ? `${t.pm} · al lavoro: è anche lo spuntino prima della piscina`
                                                : `${t.pmNuoto} · 90 minuti prima della piscina`)
                    : `${t.pm} · ${t.pmDove}`,
           ce:nuoto ? '21:30 dopo il nuoto' : '19:15' };
}

/* quantità da comprare/avere per una settimana del menù (indice 0–2): 7 colazioni, 7+7 spuntini,
   7 pranzi, 4 cene (lun–gio) e la cena pianificata del weekend; ogni pasto è una porzione */
function weekNeeds(wi){
  const m = MENU[wi], out = {};
  const add = (ing, mult=1) => { for(const k in ing) out[k] = (out[k]||0) + ing[k]*mult; };
  add(colazione().ing, 7);
  for(let d=0; d<7; d++){ add(SM[m.am[d]].ing); add(SP[m.pm[d]].ing); add(R[m.p[d]].ing); }
  for(let d=0; d<4; d++) add(R[m.c[d]].ing);
  add(R[m.cp].ing);
  return out;
}
function scopeNeeds(){
  const p = pos();
  if(S.scope === 'cur')  return weekNeeds(p.w);
  if(S.scope === 'next') return weekNeeds(turnoDi(addGiorni(p.lun, 7)));
  const out = {};
  for(let i=0; i<3; i++){ const n = weekNeeds(i); for(const k in n) out[k] = (out[k]||0) + n[k]; }
  return out;
}
/* arrotonda per eccesso: pezzi interi, grammi a 5 o 10 */
function roundBuy(v, k){
  if(aPezzi(k)) return Math.ceil(v - 0.001);
  if(v < 50) return Math.ceil(v/5)*5;
  return Math.ceil(v/10)*10;
}
/* quantità per la lista: «2 scatolette», «1,4 L», «12 fette (≈ 300 g)» */
function fmtBuy(k, q){
  const n = ING[k];
  if(n.u === 'ml' && q >= 1000) return (q/1000).toFixed(1).replace('.',',') + ' L';
  if(n.u === 'fetta') return `${q} ${q === 1 ? 'fetta' : 'fette'} (≈ ${Math.round(q*wOf(k))} g)`;
  return fmtQ(k, q);
}

/* ══════════════════════════════════════════════════════════
   8. HEADER + ANELLO (21 giorni: sono le tre settimane del ciclo e la finestra di taratura sul peso)
   ══════════════════════════════════════════════════════════ */
function drawRing(){
  const p = pos(), el = document.getElementById('ring');
  const cx=50, cy=50, r=41, N=21, gap=3, step=360/N;
  const arc = (i,cls) => {
    const a0 = -90 + i*step + gap/2, a1 = -90 + (i+1)*step - gap/2;
    const rad = a => (a*Math.PI)/180;
    const x0 = cx + r*Math.cos(rad(a0)), y0 = cy + r*Math.sin(rad(a0));
    const x1 = cx + r*Math.cos(rad(a1)), y1 = cy + r*Math.sin(rad(a1));
    return `<path class="seg ${cls}" d="M${x0.toFixed(2)} ${y0.toFixed(2)} A${r} ${r} 0 0 1 ${x1.toFixed(2)} ${y1.toFixed(2)}"/>`;
  };
  const cur = p.abs % N, primo = p.abs < N;
  let s = `<circle class="track" cx="50" cy="50" r="41"/>`;
  for(let i=0; i<N; i++){
    let cls = '';
    if(!p.pre && i === cur) cls = 'now';
    else if(!p.pre && i < cur) cls = 'done';
    else if((p.pre || primo) && (i === ASSESTAMENTO || i === 20)) cls = 'cook';   // giorno 8: prima pesata valida · giorno 21: stima provvisoria (14 giorni di pesate); la decisione è dal giorno 28 (21 giorni di pesate)
    if(cls) s += arc(i,cls);
  }
  s += `<text x="50" y="47" text-anchor="middle">${p.pre ? 0 : p.abs+1}</text>`;
  s += `<text x="50" y="59" text-anchor="middle"><tspan class="sm">GIORNO</tspan></text>`;
  el.innerHTML = s;
}
function drawHeader(){
  const p = pos(), t = TURNI[p.w];
  const dt = new Date();
  if(p.pre){
    document.getElementById('hEyebrow').textContent = 'Prima di iniziare';
    document.getElementById('hTitle').textContent   = S.dieta ? `Si parte il ${dataBreve(S.dieta)}` : 'Scegli la data';
  } else {
    document.getElementById('hEyebrow').textContent = `${t.nome} · giorno ${p.abs+1}`;
    document.getElementById('hTitle').textContent   = GG[p.d];
  }
  let sub = dt.toLocaleDateString('it-IT',{day:'numeric',month:'long'});
  if(!p.pre && nuotoDi(p.data, p.d)) sub += ' · nuoto stasera';
  document.getElementById('hSub').textContent = sub;
  drawRing();
}

/* ══════════════════════════════════════════════════════════
   9. VISTA — OGGI
   ══════════════════════════════════════════════════════════ */
const shortN = k => ING[k].n.split(' (')[0];
const lcFirst = s => s.charAt(0).toLowerCase() + s.slice(1);
const SENZA_DI = ['uova','mela','banana'];       // «3 uova», «1 mela»; gli altri: «65 g di pasta», «1 vasetto di yogurt greco»
function ingTxt(ing, mult=1){
  return Object.entries(ing).filter(([k,v]) => v > 0)
    .map(([k,v]) => SENZA_DI.includes(ING[k].u) ? fmtQ(k, v*mult) : `${fmtQ(k, v*mult)} di ${lcFirst(shortN(k))}`).join(' · ');
}
function elenco(a){ return a.length<2 ? a.join('') : a.slice(0,-1).join(', ') + ' e ' + a[a.length-1]; }

/* riquadro «cosa si cucina» */
function cookNote(list, titolo){
  if(!list.length) return '';
  const righe = list.map(x => `${x.porz} × <b>${R[x.key].nome}</b> · ${x.txt}`);
  return `<div class="cook-note"><div class="h">${titolo}</div><p>${righe.join('<br>')}</p></div>`;
}

/* riquadro mostrato prima dell'inizio della dieta */
function preCard(){
  if(!S.dieta){
    return `<div class="cook-note">
      <div class="h">Quando inizi?</div>
      <p>Scegli il primo giorno di dieta: da lì l'app conta i giorni, ti dice cosa cucinare e tiene separate le pesate di prima da quelle in dieta.</p>
      <input type="date" class="pre-date" onchange="setDieta(this.value)">
    </div>`;
  }
  const oggi = iso(new Date());
  const g = dnum(S.dieta) - dnum(oggi);
  const dd = new Date(S.dieta+'T00:00:00');
  const nome = dd.toLocaleDateString('it-IT',{weekday:'long', day:'numeric', month:'long'});
  const w0 = turnoDi(S.start);
  let h = `<div class="cook-note">
      <div class="h">Si parte ${nome}</div>
      <p>${g===1 ? 'Domani.' : `Tra ${g} giorni.`} Fino ad allora continua a pesarti ogni mattina: servono a sapere da dove parti.</p>
    </div>
    <div class="cook-note">
      <div class="h">Che turno fai nella prima settimana?</div>
      <p>Il piano è diviso per turno. Dalla seconda settimana l'app segue la rotazione 7:00 → 8:24 → 9:24; se non è la tua la cambi da Piano → Calendario dei turni.</p>
      <div class="bfast-opts">${TURNI.map((t,i)=>`<button class="bopt ${w0===i?'on':''}" onclick="setTurnoSett('${S.start}',${i})">${t.breve}</button>`).join('')}</div>
    </div>`;
  if(dd.getDay() === 1){
    h += cookNote([{key:MENU[w0].p[0], porz:1, txt:'pranzo di lunedì'}], 'La domenica prima di iniziare cucini');
  } else {
    h += `<div class="cook-note"><div class="h">Consiglio</div>
      <p>Il piano è scritto per la settimana che parte di lunedì. Partendo di ${GG[(dd.getDay()+6)%7].toLowerCase()} i primi giorni non hai avanzi pronti: cucina al momento ciò che trovi qui sotto.</p></div>`;
  }
  return h;
}

function mealCard(slot, key, eta){
  const r = R[key], n = nutri(r.ing);
  return `<button class="meal" onclick="openR('${key}')">
    <div class="meal-top"><span class="meal-slot">${slot}${r.freddo?' · freddo':''}</span><span class="meal-kcal">${n.kcal} kcal · P ${n.p} g · ${r.tempo} min</span></div>
    <h3>${r.nome}</h3>
    ${eta?`<div class="eta">${eta}</div>`:''}
    <div class="ing">${ingTxt(r.ing)}</div>
    <span class="go">Come si prepara
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
    </span>
  </button>`;
}
function simpleCard(slot, nome, ing, n, quando, nota){
  return `<div class="bfast">
    <div class="meal-top"><span class="meal-slot">${slot}</span><span class="meal-kcal">${n.kcal} kcal · P ${n.p} g</span></div>
    <h3 style="font-family:var(--display);font-size:17px;font-weight:600;margin-top:6px">${nome}</h3>
    ${quando?`<div class="eta">${quando}</div>`:''}
    <div class="ing">${ingTxt(ing)}</div>
    ${nota?`<div class="ing" style="color:var(--ink-3);margin-top:5px">${nota}</div>`:''}
  </div>`;
}
function cenaLiberaCard(slot){
  return `<div class="meal free">
    <div class="meal-top"><span class="meal-slot">${slot}</span><span class="meal-kcal">~${CENA_LIBERA.kcal} kcal</span></div>
    <h3>Cena libera</h3>
    <div class="ing" style="color:#7B3560;opacity:.9">Mangia quello che vuoi, senza pesare niente. Punta a un piatto unico (carboidrati e proteine) con la verdura: circa ${CENA_LIBERA.kcal} kcal e almeno ${CENA_LIBERA.p} g di proteine, che è la stima che l'app conta. Una pizza intera o un hamburger con patatine fritte stanno spesso sopra le 900 kcal: se li scegli, il resto della giornata non cambia e il conto settimanale sale.</div>
  </div>`;
}

function renderOggi(){
  const p = pos(), g = giornoPiano(p.lun, p.d), t = TURNI[g.w];
  const nuoto = nuotoDi(p.data, p.d);
  const o = orariGiorno(g.w, p.d, nuoto);
  const col = colazione();
  const nC = nutri(col.ing), nSM = nutri(g.am.ing), nP = nutri(R[g.pranzo].ing), nSP = nutri(g.pm.ing);
  const nE = g.libera ? CENA_LIBERA : nutri(R[g.cena].ing);
  const tot = sommaNutri([nC, nSM, nP, nSP, nE]);
  const orig = originePranzo(g.m, p.d);
  const feriale = p.d < 5;

  let h = '';
  if(p.pre) h += preCard() + `<div class="sec-label">Anteprima del primo giorno</div>`;
  else      h += cookNote(cucinaOggi(p.lun, p.d), 'Da cucinare oggi');

  h += simpleCard('Colazione', col.nome, col.ing, nC, o.col, 'La tua colazione di sempre, con un vasetto di yogurt greco in più: i frollini da soli non danno proteine e a metà mattina la fame arriva prima.');
  h += simpleCard('Spuntino · mattina', g.am.nome, g.am.ing, nSM, o.am, feriale ? 'Senza frigo e senza preparazione: lo porti da casa.' : '');
  h += mealCard('Pranzo', g.pranzo, `${o.pr} · ${orig.txt}`);
  h += simpleCard('Spuntino · pomeriggio', g.pm.nome, g.pm.ing, nSP, o.pm, (feriale && g.pm.dove === 'lavoro') ? 'Regge fuori dal frigo: lo mangi al lavoro.' : '');

  if(p.d >= 4){
    h += `<div class="bfast">
      <div class="meal-top"><span class="meal-slot">Weekend · 2 cene libere</span></div>
      <div class="ing" style="margin-top:6px">Fra venerdì, sabato e domenica una sera sola è pianificata (<b>${R[g.m.cp].nome}</b>), le altre due sono libere. Quale sera è quella pianificata?</div>
      <div class="bfast-opts">${[4,5,6].map(x=>`<button class="bopt ${cenaPianDi(p.lun)===x?'on':''}" onclick="setCenaPian('${p.lun}',${x})">${GG[x].toUpperCase()}</button>`).join('')}</div>
    </div>`;
  }
  h += g.libera ? cenaLiberaCard(`Cena · ${o.ce}`)
                : mealCard(`Cena · ${o.ce}`, g.cena, '');

  h += `<div class="sec-label">Totale della giornata</div>
    <div class="card">
      <div class="kv"><span class="k">Calorie${g.libera?`<small>compresa la cena libera, stimata ${CENA_LIBERA.kcal} kcal</small>`:''}</span><b>~${tot.kcal} kcal</b></div>
      <div class="kv"><span class="k">Proteine</span><b>${tot.p} g</b></div>
      <div class="kv"><span class="k">Carboidrati</span><b>${tot.c} g</b></div>
      <div class="kv"><span class="k">Grassi</span><b>${tot.g} g</b></div>
      <div class="kv"><span class="k">Acqua<small>almeno, di più nei giorni di nuoto</small></span><b>2 L</b></div>
    </div>`;

  if(!p.pre){
    h += `<div class="sec-label">Nuoto</div>
    <div class="card"><div class="kv">
      <span class="k">Stasera in piscina?<small>${nuoto ? 'Cena alle 21:30 e merenda 90 minuti prima della piscina. Le ~300 kcal del nuoto non vanno «restituite»: sono già nel deficit.' : 'Cena alle 19:15.'}</small></span>
      <span class="seg">
        <button class="bopt ${nuoto?'on':''}" onclick="setNuoto('${p.data}',true)">SÌ</button>
        <button class="bopt ${!nuoto?'on':''}" onclick="setNuoto('${p.data}',false)">NO</button>
      </span></div></div>`;
  }
  document.getElementById('v-oggi').innerHTML = h;
}
function setNuoto(data, v){ S.nuoto[data] = v; Store.set('nuoto', S.nuoto); drawHeader(); renderOggi(); }

const MISURE = [
  {k:'tazza',       l:'Latte nella tazza',               u:'ml', h:'quanto ne versi di solito'},
  {k:'frollini',    l:'Frollini a colazione',            u:'g',  h:'pesali una volta e conta quanti sono'},
  {k:'greco',       l:'Vasetto di yogurt greco',         u:'g',  h:'scritto sulla confezione'},
  {k:'grana_snack', l:'Busta di grana «snack»',          u:'g',  h:'scritto sulla confezione'},
  {k:'tonno',       l:'Tonno sgocciolato per scatoletta',u:'g',  h:'peso sgocciolato scritto sulla scatoletta'},
  {k:'uova',        l:'Un uovo sgusciato',               u:'g',  h:'taglia M o L sulla confezione'}
];
function setConf(k, v){
  const n = parseFloat(String(v).replace(',','.'));
  if(v === '' || isNaN(n) || n <= 0) delete S.conf[k]; else S.conf[k] = n;
  Store.set('conf', S.conf);
  drawHeader(); renderOggi(); renderPiano(); renderRicette(); renderDispensa(); renderPeso();
}
function resetConf(){ S.conf = {}; Store.set('conf', {}); setConf('', ''); }

function renderPiano(){
  const p = pos(), wi = S.planWeek, m = MENU[wi], t = TURNI[wi];

  let h = `<div class="wk">${TURNI.map((x,i)=>
    `<button class="wtab ${i===wi?'on':''}" onclick="setWeek(${i})">TURNO ${x.breve}</button>`).join('')}</div>`;

  h += `<div class="card" style="margin-bottom:4px">
    <div style="font-family:var(--display);font-size:17px;font-weight:600">${t.nome} <span class="chip">${t.orario}</span> ${wi===p.w ? '<span class="chip on">questa settimana</span>' : ''}</div>

    <div class="note" style="margin-top:8px"><b>Orari consigliati.</b> Colazione ${t.colazione} · spuntino ${t.am} (${t.amDove}) · pranzo ${t.pranzo} (a casa) · merenda ${t.pm} (${t.pmDove}; ${t.pmNuoto} nei giorni di nuoto) · cena 19:15, o 21:30 dopo il nuoto.</div>

  </div>`;

  h += `<div class="sec-label">I sette giorni</div><div class="card">`;
  for(let d=0; d<7; d++){
    const lib = d >= 4;
    const o = originePranzo(m, d);
    h += `<div class="day-row">
      <div class="dtag ${nuotoWeek(d)?'cooking':''}">${GG_S[d]}${nuotoWeek(d) ? '<br><span style="font-size:8px">NUOTO</span>' : ''}</div>
      <div class="day-body">
        <div class="dline"><i>Col</i><span>${colazione().nome}</span></div>
        <div class="dline"><i>Spunt</i><span>${SM[m.am[d]].nome}</span></div>
        <div class="dline"><i>Pranzo</i><button onclick="openR('${m.p[d]}')">${R[m.p[d]].nome}</button></div>
        ${(d>=1 && d<=4 && o.tipo==='avanzo') ? '<div class="dline"><i></i><span style="color:var(--ink-3);font-size:12px">avanzo di ieri sera</span></div>' : ''}
        <div class="dline"><i>Merenda</i><span>${SP[m.pm[d]].nome}</span></div>
        <div class="dline"><i>Cena</i>${lib
          ? '<span class="lib">Libera (o la pianificata del weekend)</span>'
          : `<button onclick="openR('${m.c[d]}')">${R[m.c[d]].nome}</button>`}</div>
      </div>
    </div>`;
  }
  h += `</div>
  <div class="card"><div class="kv"><span class="k">Cena pianificata del weekend<small>una sola sera fra venerdì, sabato e domenica; le altre due sono libere. Scegli la sera da Oggi.</small></span></div>
  <button class="rlink" onclick="openR('${m.cp}')"><div><h4>${R[m.cp].nome}</h4><p>${R[m.cp].tempo} MIN · ${nutri(R[m.cp].ing).kcal} KCAL</p></div>
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg></button></div>`;

  /* calendario dei turni: quattro settimane da questa */
  const base = p.pre ? (S.start || p.lun) : p.lun;
  h += `<div class="sec-label">Calendario dei turni</div>
  <div class="card"><p class="note" style="margin-bottom:6px">Il piano segue il turno che fai in quella settimana. Se non cambi niente la rotazione parte dal turno 9:24 della settimana del 12/10 e prosegue 7:00 → 8:24 → 9:24; tocca un turno per correggerla (le settimane dopo ripartono da lì).</p>`;
  for(let i=0; i<4; i++){
    const lun = addGiorni(base, 7*i), fine = addGiorni(lun, 6), tu = turnoDi(lun);
    h += `<div class="wk-row"><div class="per">${dt2it(lun)} – ${dt2it(fine)}<small>${i===0?(p.pre?'prima settimana':'questa settimana'):(i===1?'prossima':'')}</small></div>
      <div class="bfast-opts" style="margin:0;width:210px">${TURNI.map((x,k)=>`<button class="bopt ${tu===k?'on':''}" onclick="setTurnoSett('${lun}',${k})">${x.breve}</button>`).join('')}</div></div>`;
  }
  h += `<button class="ghost" onclick="resetTurni()">Ripristina la rotazione di base</button></div>`;

  h += `<div class="sec-label">Le tue misure</div>
  <div class="card"><p class="note" style="margin-bottom:6px">Il piano conta le confezioni; qui dici quanto pesano davvero. Dove non lo so, ho messo un'ipotesi: correggila e tutte le calorie si ricalcolano.</p>`;
  MISURE.forEach(x=>{
    h += `<div class="pan-row"><span class="nm">${x.l}<br><span class="need">${x.h}</span></span>
      <input type="number" inputmode="decimal" min="0" step="any" value="${S.conf[x.k] ?? CONF_DEF[x.k]}" onchange="setConf('${x.k}',this.value)" aria-label="${x.l}">
      <span class="u">${x.u}</span></div>`;
  });
  h += `<button class="ghost" onclick="resetConf()">Ripristina i valori di partenza</button></div>`;

  h += `<div class="sec-label">Impostazioni</div>
  <div class="card">
    <div class="kv">
      <span class="k">Primo giorno di dieta<small>meglio un lunedì, dopo aver cucinato il pranzo del lunedì la domenica</small></span>
      <input type="date" id="startDate" value="${S.dieta || ''}" onchange="setDieta(this.value)">
    </div>
    <div class="kv"><span class="k">Oggi sei al giorno</span><b>${p.pre ? 'non ancora iniziata' : (p.abs+1)}</b></div>
  </div>`;

  const mp = macroPiano(), rif = pesoRif(), I = mediaSettimana(), f = k => Math.round(I + k*1100);
  h += `<div class="sec-label">Su cosa è calcolato</div>
  <div class="card">
    <div class="kv"><span class="k">Struttura</span><b>5 pasti</b></div>
    <div class="kv"><span class="k">Giorni con la cena del piano<small>media dei giorni con la cena pianificata</small></span><b>~${mediaPiano()} kcal</b></div>
    <div class="kv"><span class="k">Media settimanale<small>con le 2 cene libere del weekend contate ${CENA_LIBERA.kcal} kcal (ipotesi)</small></span><b>~${I} kcal</b></div>
    <div class="kv"><span class="k">Proteine<small>${(mp.p/rif).toFixed(2).replace('.',',')} g per kg di peso</small></span><b>~${mp.p} g</b></div>
    <div class="kv"><span class="k">Carboidrati</span><b>~${mp.c} g</b></div>
    <div class="kv"><span class="k">Grassi</span><b>~${mp.g} g</b></div>
    <div class="kv"><span class="k">Fabbisogno stimato<small>da formula, con circa 3.000 passi al giorno: da verificare sulla bilancia</small></span><b>~2.350 (2.100–2.550)</b></div>
  </div>`;

  h += `<div class="sec-label">Misura il tuo fabbisogno vero</div>
  <div class="card">
    <p class="note">Il valore di circa 2.350 kcal (tra 2.100 e 2.550) viene da una formula e può sbagliare del 10–15 %, in più o in meno. Il dato vero lo dà la bilancia, ma solo da quando mangi le quantità del piano: prima non sai quanto mangiavi davvero.</p>
    <p class="note"><b>Giorni 1–${ASSESTAMENTO}: non contano.</b> Cambiando alimentazione perdi acqua e glicogeno (1–2 kg), che non è grasso. La stima parte dall'ottavo giorno.</p>
    <p class="note">Pesati ogni mattina a digiuno. Il peso oscilla di circa ±0,6 kg da un giorno all'altro: servono <b>14 giorni</b> di pesate per una stima provvisoria e <b>21</b> per una affidabile. La trovi nella sezione Peso.</p>
    <p class="note">Come leggere la pendenza, mangiando circa ${I} kcal al giorno di media:<br>
    <b>−0,5 kg</b> a settimana → il tuo fabbisogno è circa ${f(0.5)} kcal<br>
    <b>−0,25 kg</b> → circa ${f(0.25)} kcal<br>
    <b>peso invariato</b> → circa ${I} kcal: il piano è già al tuo mantenimento<br>
    <b>+0,3 kg</b> → circa ${f(-0.3)} kcal: il piano è sopra il mantenimento</p>
  </div>`;

  h += `<div class="sec-label">Come tarare il piano</div>
  <div class="card">
    <p class="note"><b>Pesati ogni mattina</b> a digiuno, dopo il bagno. Conta la tendenza, non il singolo numero.</p>
    <p class="note">Dopo 21 giorni di pesate valide (dall'ottavo giorno di dieta):<br>
    <b>meno di 0,25 kg a settimana</b> → togli 150 kcal al giorno (ad esempio 40 g di pasta in meno) oppure aggiungi 2.000 passi.<br>
    <b>tra 0,25 e 0,8 kg a settimana</b> → il piano funziona, non toccare niente.<br>
    <b>più di 0,8 kg a settimana</b> → aggiungi 150 kcal: scendere troppo in fretta fa perdere anche massa muscolare.</p>
    <p class="note">Prima dei 21 giorni non cambiare le porzioni: il rumore della bilancia è più grande del segnale.</p>
    <p class="note" style="color:var(--ink-3);margin-top:14px">Calorie e macro sono calcolati dagli ingredienti: i prodotti che hai in casa con i valori dell'etichetta, gli altri su tabelle nutrizionali standard (CREA/USDA). I prodotti che compri davvero possono discostarsi del 10–15 %. Questo piano non sostituisce il parere di un medico o di un nutrizionista.</p>
  </div>`;

  document.getElementById('v-piano').innerHTML = h;
}
function setWeek(i){ S.planWeek=i; renderPiano(); }
function setDieta(v){
  if(!v) return;
  S.dieta = v;
  S.start = iso(mondayOf(new Date(v+'T00:00:00')));       // le settimane partono dal lunedì di quella settimana

  drawHeader(); renderOggi(); renderPiano(); renderDispensa(); renderPeso();
}

/* ══════════════════════════════════════════════════════════
   11. VISTA — RICETTE
   ══════════════════════════════════════════════════════════ */
const GRUPPI = ['Pasta e riso freddi','Pasta e riso caldi','Carne e pesce','Uova e legumi','Piatti freddi e panini'];
function renderRicette(){
  let h = '';
  GRUPPI.forEach(gr=>{
    const keys = Object.keys(R).filter(k => R[k].tipo === gr);
    if(!keys.length) return;
    h += `<div class="sec-label">${gr}</div><div class="card">`;
    h += keys.map(k=>{ const n = nutri(R[k].ing);
      return `<button class="rlink" onclick="openR('${k}')">
        <div><h4>${R[k].nome}</h4><p>${R[k].tempo} MIN · ${n.kcal} KCAL · P ${n.p} G</p></div>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
      </button>`; }).join('');
    h += `</div>`;
  });
  h += `<div class="sec-label">Regole valide sempre</div>
  <div class="card">
    <p class="note"><b>Porzione doppia.</b> La cena di lunedì–giovedì si cucina per due: la metà che avanza va in frigo in un contenitore chiuso entro un'ora dalla cottura, ed è il pranzo del giorno dopo. Mangiala entro 24 ore (il riso, mai oltre).</p>
    <p class="note"><b>Friggitrice ad aria:</b> zucchine 180 °C per 13–15 min, patate 190 °C per 18–20 min, carote 180 °C per 15–18 min, nasello 180 °C per 10–12 min. Scuoti il cestello a metà. I tempi vanno tarati sul tuo modello nei primi giri.</p>
    <p class="note"><b>Uova:</b> mai sode. Sempre saltate in padella a fuoco medio-basso, tolte quando sono ancora leggermente umide.</p>
    <p class="note"><b>Spuntino di mattina:</b> senza frigo e senza preparazione (grana in busta, frutta secca, frutta). Niente tonno e niente pane. <b>Merenda:</b> a casa può essere fresca; nel turno 9:24, che la fai al lavoro, regge fuori dal frigo.</p>
    <p class="note"><b>Olio e frutta secca:</b> pesali. Un cucchiaino d'olio sono circa 4–5 g, cioè circa 40 kcal: è la parte che conta di più e che si sbaglia di più a occhio.</p>
    <p class="note"><b>Tonno:</b> non più di 3 porzioni (6 scatolette) a settimana: il piano resta sotto questo limite.</p>
    <p class="note"><b>Giorni di nuoto:</b> nessun extra da mangiare. Il nuoto brucia circa 300 kcal nette per seduta e sono già nel deficit calcolato.</p>
    <p class="note"><b>Verdure:</b> le quantità sono indicate; solo le zucchine puoi aumentarle senza pesarle.</p>
  </div>`;
  document.getElementById('v-ricette').innerHTML = h;
}

/* ══════════════════════════════════════════════════════════
   12. SCHEDA RICETTA
   ══════════════════════════════════════════════════════════ */
let keySheet = null, porzSheet = 1;
const isDoppia = key => MENU.some(m => m.c.includes(key));
function usoRicetta(key){
  const out = [];
  MENU.forEach(m=>{
    const tn = TURNI[m.turno].nome;
    m.c.forEach((k,d)=>{ if(k === key) out.push(`${tn}: cena di ${GG[d].toLowerCase()}`); });
    m.p.forEach((k,d)=>{ if(k === key) out.push(`${tn}: pranzo di ${GG[d].toLowerCase()}`); });
    if(m.cp === key) out.push(`${tn}: cena pianificata del weekend`);
  });
  return out;
}
function openR(key){
  keySheet = key; porzSheet = isDoppia(key) ? 2 : 1;
  renderSheet();
  document.getElementById('sheet').classList.add('on');
  document.getElementById('sheet').scrollTop = 0;
  document.body.style.overflow='hidden';
}
function setPorz(n){ porzSheet = n; renderSheet(); }
function renderSheet(){
  const key = keySheet, r = R[key], n = nutri(r.ing), doppia = isDoppia(key);
  let h = `<h2>${r.nome}</h2>
    <div class="rmeta">
      <span>${r.tempo} MIN</span><span>${n.kcal} KCAL A PORZIONE</span><span>${doppia ? 'DOPPIA PORZIONE' : 'SI CUCINA AL MOMENTO'}</span>
      <span>P ${n.p} G</span><span>C ${n.c} G</span><span>G ${n.g} G</span>
    </div>`;
  const uso = usoRicetta(key);
  if(uso.length) h += `<p class="note" style="margin-top:10px">${uso.join(' · ')}</p>`;

  h += `<div class="sec-label">Ingredienti</div><div class="card">
    <div class="bfast-opts" style="margin:0 0 6px">${[1,2,3].map(x=>`<button class="bopt ${porzSheet===x?'on':''}" onclick="setPorz(${x})">${x} ${x===1?'PORZIONE':'PORZIONI'}</button>`).join('')}</div>
    <ul class="ilist">`;
  for(const k in r.ing){
    if(!(r.ing[k] > 0)) continue;
    h += `<li><span>${ING[k].n}</span><b>${fmtQ(k, r.ing[k]*porzSheet)}</b></li>`;
  }
  (r.libere||[]).forEach(x => h += `<li><span class="free-txt">${x}</span><b class="free-txt">q.b.</b></li>`);
  h += `</ul></div>`;

  h += `<div class="sec-label">Procedimento</div><div class="card"><ol class="steps">`;
  r.passi.forEach(p => h += `<li><h4>${p.t}</h4><p>${p.d}</p></li>`);
  h += `</ol>`;
  if(r.warn) h += `<div class="warn">${r.warn}</div>`;
  h += `</div>`;

  h += `<div class="sec-label">Conservazione</div><div class="keep"><b>${doppia ? 'Porzione doppia' : 'Conservazione'}</b>${r.keep}</div>`;

  document.getElementById('sheetBody').innerHTML = h;
}
function closeSheet(){
  document.getElementById('sheet').classList.remove('on');
  document.body.style.overflow='';
}

/* ══════════════════════════════════════════════════════════
   13. VISTA — DISPENSA E SPESA
   ══════════════════════════════════════════════════════════ */
function listaMancante(needs){
  const missing = [];
  for(const k in needs){
    const have = S.pantry[k] || 0, gap = needs[k] - have;
    if(gap > 0.001) missing.push([k, roundBuy(gap, k)]);
  }
  return missing;
}
function buyRows(missing){
  let h = '';
  CATS.forEach(c=>{
    const rows = missing.filter(([k]) => ING[k].c === c);
    if(!rows.length) return;
    h += `<div class="buy-cat">${c}</div>`;
    rows.forEach(([k,q]) => h += `<div class="buy-row">
      <span class="nm">${ING[k].n}${ING[k].casa ? ' <span class="chip">ne hai già</span>' : ''}</span><span class="qt">${fmtBuy(k,q)}</span></div>`);
  });
  return h;
}
const UNITA_BREVE = {vasetto:'vasetti', busta:'buste', scatoletta:'scat.', fetta:'fette', uova:'uova', mela:'mele', banana:'banane'};
function unitLbl(k){ const n = ING[k]; return n.un ? (UNITA_BREVE[n.u] || n.un[1]) : n.u; }
function needTxt(k, v){ return fmtBuy(k, aPezzi(k) ? Math.round(v*10)/10 : Math.round(v)); }
function renderDispensa(){
  const needs = scopeNeeds();
  const labels = {cur:'Questa settimana', next:'La prossima', all:'Tutte e 3'};

  let h = `<div class="sec-label">Calcola per</div>
  <div class="scope">${['cur','next','all'].map(s=>
    `<button class="sbtn ${S.scope===s?'on':''}" onclick="setScope('${s}')">${labels[s].toUpperCase()}</button>`).join('')}</div>
  <p class="note" style="margin-top:9px;color:var(--ink-3)">Conta i pasti di una settimana intera, lunedì–domenica. Il pranzo del lunedì si cucina la domenica prima: fai la spesa entro sabato. Le due cene libere del weekend non sono nella lista.</p>`;

  const missing = listaMancante(needs);
  h += `<div class="sec-label">Da comprare</div><div class="buy">
    <div class="buy-head"><h3>Lista della spesa</h3><span id="nVoci">${missing.length} VOCI</span></div><div id="buyBody">`;
  h += missing.length ? buyRows(missing)
    : `<div class="ok-state"><b>Dispensa a posto</b>Hai già tutto quello che serve per ${labels[S.scope].toLowerCase()}.</div>`;
  h += `</div></div>`;

  h += `<div class="sec-label">Cosa hai in casa</div>
  <div class="card"><p class="note" style="margin-bottom:4px">Scrivi le quantità che hai già, nell'unità indicata. La lista qui sopra si aggiorna da sola sottraendole al fabbisogno. Le voci con «ne hai già» sono quelle di cui hai letto l'etichetta: manca solo la quantità.</p></div>`;

  CATS.forEach(c=>{
    const keys = Object.keys(ING).filter(k => ING[k].c === c && needs[k]);
    if(!keys.length) return;
    h += `<div class="pan-cat">${c}</div><div class="card" style="padding:4px 16px">`;
    keys.forEach(k=>{
      const n = ING[k];
      h += `<div class="pan-row">
        <span class="nm">${n.n}<br><span class="need">serve ${needTxt(k, needs[k])}</span></span>
        <input type="number" inputmode="decimal" min="0" step="any" value="${S.pantry[k] ?? ''}"
               placeholder="0" oninput="setPan('${k}',this.value)" aria-label="${n.n}">
        <span class="u">${unitLbl(k)}</span>
      </div>`;
    });
    h += `</div>`;
  });

  h += `<button class="ghost" onclick="clearPan()">Azzera la dispensa</button>`;
  document.getElementById('v-dispensa').innerHTML = h;
}
function setScope(s){ S.scope=s; Store.set('scope',s); renderDispensa(); }

let panTimer;
function setPan(k,v){
  const n = parseFloat(String(v).replace(',','.'));
  if(v==='' || isNaN(n)) delete S.pantry[k]; else S.pantry[k]=Math.max(0,n);
  Store.set('pantry', S.pantry);
  clearTimeout(panTimer);
  panTimer = setTimeout(()=>{                       // aggiorna solo la lista, senza perdere il focus
    const missing = listaMancante(scopeNeeds());
    const body = document.getElementById('buyBody'), nv = document.getElementById('nVoci');
    if(!body || !nv) return;
    nv.textContent = `${missing.length} VOCI`;
    body.innerHTML = missing.length ? buyRows(missing)
      : `<div class="ok-state"><b>Dispensa a posto</b>Hai già tutto quello che serve.</div>`;
  }, 250);
}
function clearPan(){ S.pantry={}; Store.set('pantry',{}); renderDispensa(); }

/* ══════════════════════════════════════════════════════════
   13-bis. PESO
   ══════════════════════════════════════════════════════════ */
const OBIETTIVO = 85;
const ASSESTAMENTO = 7;         // i primi 7 giorni di dieta non entrano nella stima (acqua e glicogeno, non grasso)

/* kcal e macro di ogni giorno delle tre settimane, calcolati dalle ricette. La cena pianificata è quella
   di default (domenica); le altre due sere del weekend sono libere e contano come CENA_LIBERA (ipotesi). */
function giorniPiano(){
  const out = [];
  MENU.forEach((m,wi)=>{
    for(let d=0; d<7; d++){
      const cenaKey = d < 4 ? m.c[d] : (d === CENA_PIAN_DEF ? m.cp : null);
      const t = nutriGiorno({am:SM[m.am[d]], pm:SP[m.pm[d]], pranzo:m.p[d], cena:cenaKey, libera:cenaKey === null});
      out.push({wi, d, free:cenaKey === null, kcal:t.kcal, p:t.p, c:t.c, g:t.g});
    }
  });
  return out;
}
/* media dei giorni con la cena del piano (esclude le due sere libere) */
function mediaPiano(){
  const g = giorniPiano().filter(x=>!x.free);
  return Math.round(g.reduce((a,x)=>a+x.kcal,0)/g.length);
}
/* media su tutti i 21 giorni: le cene libere sono già contate con la stima */
function mediaSettimana(){
  const g = giorniPiano();
  return Math.round(g.reduce((a,x)=>a+x.kcal,0)/g.length);
}
function macroPiano(){
  const g = giorniPiano(), m = k => Math.round(g.reduce((a,x)=>a+x[k],0)/g.length);
  return {p:m('p'), c:m('c'), g:m('g')};
}

const dt2it = iso => { const [y,m,g]=iso.split('-'); return `${g}/${m}`; };
const kg  = v => v.toFixed(1).replace('.',',');
const kgs = v => (v>=0 ? '+' : '−') + kg(Math.abs(v));          // con segno
const mediaKg = a => a.reduce((s,x)=>s+x.v,0)/a.length;

/* giorni interi da una data ISO (in UTC: nessuno sfasamento per l'ora legale) */
function dnum(s){ const [y,m,g]=s.split('-').map(Number); return Date.UTC(y,m-1,g)/86400000; }
function addGiorni(s,n){ const [y,m,g]=s.split('-').map(Number); return new Date(Date.UTC(y,m-1,g+n)).toISOString().slice(0,10); }
function dataBreve(s){ return new Date(s+'T00:00:00').toLocaleDateString('it-IT',{day:'numeric',month:'long'}); }

/* valore critico t di Student al 95% (due code) per i gradi di libertà */
const TCRIT = [0,12.71,4.30,3.18,2.78,2.57,2.45,2.36,2.31,2.26,2.23,2.20,2.18,2.16,2.14,2.13,2.12,2.11,2.10,2.09,2.09,2.08,2.07,2.07,2.06,2.06,2.06,2.05,2.05,2.05,2.04];
function tcrit(df){ return df < TCRIT.length ? TCRIT[df] : (df<=40 ? 2.03 : (df<=60 ? 2.01 : 1.98)); }

/* regressione lineare delle pesate: pendenza in kg/giorno, errore standard e intervallo al 95% */
function regressione(arr){
  const n = arr.length;
  if(n < 3) return null;
  const x0 = dnum(arr[0].d);
  const xs = arr.map(a=>dnum(a.d)-x0), ys = arr.map(a=>a.v);
  const mx = xs.reduce((a,b)=>a+b,0)/n, my = ys.reduce((a,b)=>a+b,0)/n;
  let num=0, den=0;
  xs.forEach((x,i)=>{ num += (x-mx)*(ys[i]-my); den += (x-mx)*(x-mx); });
  if(!den) return null;
  const slope = num/den, q = my - slope*mx;
  let sse = 0;
  xs.forEach((x,i)=>{ const e = ys[i]-(q+slope*x); sse += e*e; });
  const sd = Math.sqrt(sse/(n-2)), se = sd/Math.sqrt(den), h = tcrit(n-2)*se;
  return {slope, se, ic:[slope-h, slope+h], sd, n, giorni: Math.round(xs[n-1]-xs[0])+1};   // giorni = giorni di calendario coperti
}

/* pesate prima della dieta (o tutte, se la data non è impostata) */
function pesiPre(){   return S.dieta ? S.pesi.filter(x=>x.d <  S.dieta) : S.pesi.slice(); }
function pesiDieta(){ return S.dieta ? S.pesi.filter(x=>x.d >= S.dieta) : []; }
/* pesate valide per la stima: dall'ottavo giorno di dieta */
function pesiStima(){
  if(!S.dieta) return [];
  const lim = addGiorni(S.dieta, ASSESTAMENTO);
  return S.pesi.filter(x=>x.d >= lim);
}
function giornoDieta(d){ return S.dieta ? dnum(d) - dnum(S.dieta) + 1 : null; }
/* peso di riferimento per i g/kg: media delle ultime 14 pesate prima della dieta, altrimenti 96 */
function pesoRif(){ const pre = pesiPre(); return pre.length ? mediaKg(pre.slice(-14)) : 96; }

/* stima del fabbisogno reale: introito medio del piano meno (pendenza × 7700 kcal/kg).
   Vale solo per le pesate in dieta, quando l'introito è quello del piano. */
function stimaDieta(){
  const v = pesiStima(), r = regressione(v);
  if(!r || r.n < 6 || r.giorni < 14) return {ok:false, n:v.length, giorni: r ? r.giorni : 0};
  const I = mediaSettimana(), [lo,hi] = r.ic;
  return {ok:true, r, I, n:r.n, giorni:r.giorni, sicura: r.giorni >= 21,
          stima: Math.round(I - r.slope*7700), da: Math.round(I - hi*7700), a: Math.round(I - lo*7700)};
}
/* regola pratica sul ritmo (kg a settimana, negativo = scendi) */
function verdetto(s7){
  if(s7 > -0.25) return 'Il peso non scende abbastanza: il deficit è troppo piccolo. Togli 150 kcal al giorno (ad esempio 40 g di pasta in meno) oppure aggiungi 2.000 passi al giorno.';
  if(s7 < -0.8) return 'Scendi troppo in fretta: aggiungi 150 kcal (ad esempio 40 g di pasta o 25 g di mandorle) per non perdere massa muscolare.';
  return 'Il ritmo è quello giusto, non cambiare niente.';
}

/* raggruppa le pesate per settimana (lunedì–domenica) */
function settimane(){
  const out = {};
  S.pesi.forEach(x=>{
    const d = new Date(x.d+'T00:00:00');
    const lun = new Date(d); lun.setDate(d.getDate() - ((d.getDay()+6)%7));
    const k = iso(lun);
    (out[k] = out[k] || []).push(x.v);
  });
  return Object.keys(out).sort().map(k=>{
    const v = out[k];
    return {inizio:k, n:v.length, media: v.reduce((a,b)=>a+b,0)/v.length};
  });
}
/* variazione rispetto alla settimana prima, solo se entrambe hanno almeno 3 pesate */
function deltaSett(w,i){ return (i>0 && w[i].n>=3 && w[i-1].n>=3) ? w[i].media - w[i-1].media : null; }

function graficoSVG(){
  const p = S.pesi;
  if(p.length < 2) return '';
  const W=320, H=140, ml=30, mr=8, mt=10, mb=18;
  const x0 = dnum(p[0].d);
  const xs = p.map(x=>dnum(x.d)-x0);
  const ys = p.map(x=>x.v);
  const span = Math.max(xs[xs.length-1], 1);
  let lo = Math.min(...ys), hi = Math.max(...ys);
  if(OBIETTIVO >= lo-3 && OBIETTIVO <= hi+3){ lo = Math.min(lo, OBIETTIVO); hi = Math.max(hi, OBIETTIVO); }
  const pad = Math.max((hi-lo)*0.18, 0.6); lo -= pad; hi += pad;
  const X = v => ml + (v/span)*(W-ml-mr);
  const Y = v => mt + (1-(v-lo)/(hi-lo))*(H-mt-mb);
  const pts = xs.map((x,i)=>[X(x), Y(ys[i])]);
  const linea = pts.map((q,i)=>(i?'L':'M')+q[0].toFixed(1)+' '+q[1].toFixed(1)).join(' ');
  const area = linea + ` L${pts[pts.length-1][0].toFixed(1)} ${H-mb} L${pts[0][0].toFixed(1)} ${H-mb} Z`;
  let g = '';
  [0,0.5,1].forEach(f=>{ const v=lo+(hi-lo)*f, y=Y(v);
    g += `<line class="gl" x1="${ml}" y1="${y.toFixed(1)}" x2="${W-mr}" y2="${y.toFixed(1)}"/>`;
    g += `<text x="${ml-5}" y="${(y+3).toFixed(1)}" text-anchor="end">${v.toFixed(1)}</text>`; });
  if(OBIETTIVO>lo && OBIETTIVO<hi){
    const y=Y(OBIETTIVO);
    g += `<line class="tgt" x1="${ml}" y1="${y.toFixed(1)}" x2="${W-mr}" y2="${y.toFixed(1)}"/>`;
    g += `<text x="${W-mr}" y="${(y-5).toFixed(1)}" text-anchor="end" fill="#E0A32E">obiettivo ${OBIETTIVO}</text>`;
  }
  /* linea verticale all'inizio della dieta */
  if(S.dieta){
    const dx = dnum(S.dieta) - x0;
    if(dx > 0 && dx <= span){
      const x = X(dx);
      g += `<line class="ms" x1="${x.toFixed(1)}" y1="${mt}" x2="${x.toFixed(1)}" y2="${H-mb}"/>`;
      g += `<text x="${(x+4).toFixed(1)}" y="${mt+8}">dieta</text>`;
    }
  }
  g += `<path class="ar" d="${area}"/><path class="ln" d="${linea}"/>`;
  const salta = Math.ceil(pts.length/22);
  pts.forEach((q,i)=>{ if(i%salta && i!==pts.length-1) return;
    g += `<circle class="${i===pts.length-1?'lastpt':'pt'}" cx="${q[0].toFixed(1)}" cy="${q[1].toFixed(1)}" r="${i===pts.length-1?4:3}"/>`; });
  g += `<text x="${ml}" y="${H-5}">${dt2it(p[0].d)}</text>`;
  g += `<text x="${W-mr}" y="${H-5}" text-anchor="end">${dt2it(p[p.length-1].d)}</text>`;
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}">${g}</svg></div>`;
}

function testoExport(){
  const p = S.pesi;
  if(!p.length) return 'Nessuna pesata registrata.';
  const pre = pesiPre();
  let t = `PESO — Piano Alimentare\n`;
  t += `Piano: ~${mediaPiano()} kcal/giorno nei giorni con la cena del piano, ~${mediaSettimana()} kcal/giorno di media settimanale (2 cene libere a settimana contate ${CENA_LIBERA.kcal} kcal)\n`;
  t += S.dieta ? `Primo giorno di dieta: ${S.dieta}\n`
               : `Primo giorno di dieta: non impostato (tutte le pesate contano come PRIMA della dieta)\n`;
  t += `\nPESATE (${p.length})\n`;
  p.forEach(x=>{
    const g = giornoDieta(x.d);
    t += `${x.d}  ${kg(x.v)} kg` + (g!==null && g>=1 ? `  [giorno ${g}${g<=ASSESTAMENTO?', assestamento':''}]` : '') + `\n`;
  });
  const w = settimane();
  if(w.length){
    t += `\nMEDIE SETTIMANALI\n`;
    w.forEach((x,i)=>{
      const d = deltaSett(w,i);
      t += `Sett. dal ${x.inizio}: ${kg(x.media)} kg (${x.n} pesate${x.n<3?', parziale':''})` + (d!==null ? `  ${kgs(d)}` : '') + `\n`;
    });
  }
  if(pre.length){
    const rp = pre.length >= 8 ? regressione(pre) : null;
    t += `\nPRIMA DELLA DIETA\nPesate: ${pre.length}, media ${kg(mediaKg(pre))} kg`;
    if(rp) t += `\nTendenza: ${kgs(rp.slope*7)} kg a settimana (intervallo 95%: da ${kgs(rp.ic[0]*7)} a ${kgs(rp.ic[1]*7)}) su ${rp.giorni} giorni`;
    t += `\nLe calorie di quel periodo non sono note: nessuna stima del fabbisogno.\n`;
  }
  if(S.dieta){
    const st = stimaDieta(), din = pesiDieta();
    t += `\nIN DIETA\nPesate dal primo giorno: ${din.length} (le prime ${ASSESTAMENTO} giornate non entrano nella stima)\n`;
    if(st.ok){
      t += `Tendenza: ${kgs(st.r.slope*7)} kg a settimana (intervallo 95%: da ${kgs(st.r.ic[0]*7)} a ${kgs(st.r.ic[1]*7)}) su ${st.giorni} giorni\n`;
      t += `Fabbisogno stimato: ~${st.stima} kcal/giorno (da ${st.da} a ${st.a}), ${st.sicura?'affidabile':'provvisoria'}, con introito ~${st.I} kcal/giorno\n`;
    } else {
      t += `Stima non ancora disponibile: servono 14 giorni di pesate dall'ottavo giorno (ora ${st.n} pesate, ${st.giorni} giorni).\n`;
    }
  }
  return t;
}

function renderPeso(){
  const p = S.pesi, ultimo = p.length ? p[p.length-1] : null;
  let h = `<div class="sec-label">Registra una pesata</div>
    <div class="w-in">
      <input type="date" id="pData" value="${iso(new Date())}" max="${iso(new Date())}">
      <input type="number" id="pKg" inputmode="decimal" step="0.1" min="30" max="300" placeholder="kg">
      <button class="w-add" onclick="addPeso()">Salva</button>
    </div>
    <p class="note" style="margin-top:9px;color:var(--ink-3)">Pesati al mattino, a digiuno, dopo il bagno. Il singolo numero oscilla anche di un chilo per acqua e sale: conta la tendenza.</p>`;

  if(!S.dieta){
    h += `<div class="cook-note" style="margin-top:16px"><div class="h">Quando inizi la dieta?</div>
      <p>Finché non imposti il primo giorno, tutte le pesate contano come «prima della dieta» e non viene calcolato nessun fabbisogno.</p>
      <input type="date" class="pre-date" onchange="setDieta(this.value)"></div>`;
  }

  if(!p.length){
    h += `<div class="card" style="margin-top:16px"><div class="empty"><b>Nessuna pesata</b>Registra il primo peso per iniziare a vedere l'andamento.</div></div>`;
    document.getElementById('v-peso').innerHTML = h;
    return;
  }

  const pre = pesiPre(), din = pesiDieta();
  const base = pre.length ? mediaKg(pre.slice(-14)) : null;
  const dalla = (din.length && base!==null) ? ultimo.v - base : null;
  h += `<div class="w-big">
    <div class="w-stat"><div class="lbl">Ultimo</div><div class="val">${kg(ultimo.v)}</div><div class="sub">${dt2it(ultimo.d)}</div></div>
    <div class="w-stat"><div class="lbl">Dalla partenza</div><div class="val ${dalla===null?'':(dalla<0?'dn':(dalla>0?'up':''))}">${dalla===null?'—':kgs(dalla)}</div><div class="sub">${base!==null?'partenza '+kg(base):'—'}</div></div>
    <div class="w-stat"><div class="lbl">All'obiettivo</div><div class="val">${kg(Math.max(0, ultimo.v-OBIETTIVO))}</div><div class="sub">restano</div></div>
  </div>`;

  if(p.length>1){ h += `<div class="sec-label">Andamento</div>` + graficoSVG(); }

  /* ── prima della dieta: serve solo a sapere da dove parti ── */
  const rp = pre.length >= 8 ? regressione(pre) : null;
  if(rp && rp.giorni >= 14){
    const stabile = rp.ic[0] <= 0 && rp.ic[1] >= 0;
    h += `<div class="sec-label">Prima della dieta</div><div class="card">
      <p class="note">${pre.length} pesate in ${rp.giorni} giorni, media <b>${kg(mediaKg(pre))} kg</b>. Tendenza ${kgs(rp.slope*7)} kg a settimana (tra ${kgs(rp.ic[0]*7)} e ${kgs(rp.ic[1]*7)}).
      ${stabile ? 'Il peso era stabile: mangiavi circa quanto consuma il tuo corpo.' : (rp.slope>0 ? 'Il peso saliva: mangiavi sopra il tuo mantenimento.' : 'Il peso scendeva già prima della dieta.')}</p>
      <p class="note">Da questo periodo non si può ricavare il fabbisogno in kcal, perché non sai quanto mangiavi davvero. Lo stimo dalle settimane in dieta, quando le calorie sono quelle del piano.</p>
    </div>`;
  }

  /* ── in dieta: la stima del fabbisogno ── */
  h += `<div class="sec-label">Il tuo fabbisogno reale</div>`;
  if(!S.dieta){
    h += `<div class="card"><p class="note">Imposta il primo giorno di dieta: la stima parte dall'ottavo giorno, quando mangi le quantità del piano.</p></div>`;
  } else if(iso(new Date()) < S.dieta && !din.length){
    h += `<div class="card"><p class="note">La dieta parte il ${dataBreve(S.dieta)}. La stima comparirà dopo 3 settimane di pesate.</p></div>`;
  } else {
    const st = stimaDieta();
    if(st.ok){
      const s7 = st.r.slope*7;
      h += `<div class="tdee">
        <div class="lbl">${st.sicura ? 'Stimato dal tuo andamento' : 'Stima provvisoria'}</div>
        <div class="val">~${st.stima} kcal</div>
        <p>Probabilmente tra ${st.da} e ${st.a} kcal (intervallo al 95%). Stai facendo <b>${kgs(s7)} kg a settimana</b> (tra ${kgs(st.r.ic[0]*7)} e ${kgs(st.r.ic[1]*7)}) su ${st.giorni} giorni, mangiando in media ~${st.I} kcal (cene libere contate ${CENA_LIBERA.kcal} kcal).
        ${st.sicura ? verdetto(s7) : 'Con meno di 21 giorni di dati l\'intervallo è ancora largo: decidi se toccare le porzioni solo dopo.'}</p>
      </div>`;
    } else {
      h += `<div class="card"><p class="note"><b>Giorni 1–${ASSESTAMENTO}: non contano.</b> Cambiando alimentazione perdi acqua e glicogeno, che non è grasso. La stima usa le pesate dal ${dt2it(addGiorni(S.dieta, ASSESTAMENTO))}.</p>
        <p class="note">Finora: ${st.n} pesat${st.n===1?'a valida':'e valide'} su ${st.giorni} giorni. Servono 14 giorni di pesate (almeno 6) per una stima provvisoria, 21 per una affidabile.</p></div>`;
    }
  }

  const w = settimane();
  if(w.length>1){
    const lunD = S.dieta ? iso(mondayOf(new Date(S.dieta+'T00:00:00'))) : null;
    h += `<div class="sec-label">Medie settimanali</div><div class="card">`;
    w.forEach((x,i)=>{
      const d = deltaSett(w,i);
      h += `<div class="wk-row">
        <div class="per">Settimana dal ${dt2it(x.inizio)}<small>${x.n} pesat${x.n===1?'a':'e'}${x.n<3?' · parziale':''}${lunD && x.inizio>=lunD?' · dieta':''}</small></div>
        <div class="med ${x.n<3?'par':''}">${kg(x.media)}</div>
        <div class="dlt ${d===null?'':(d<0?'dn':(d>0?'up':''))}">${d===null?'—':kgs(d)}</div>
      </div>`;
    });
    h += `</div>`;
  }

  h += `<div class="sec-label">Storico</div><div class="card">`;
  [...p].reverse().forEach(x=>{
    h += `<div class="p-row"><span class="dt">${x.d.split('-').reverse().join('/')}</span>
      <span class="kg">${kg(x.v)} kg</span>
      <button class="x" onclick="delPeso('${x.d}')" aria-label="elimina">×</button></div>`;
  });
  h += `</div>`;

  h += `<div class="sec-label">Esporta</div>
    <button class="exp" onclick="copiaPeso()">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>
      Copia tutto negli appunti
    </button>
    <textarea class="expbox" id="expBox" readonly onclick="this.select()">${testoExport().replace(/</g,'&lt;')}</textarea>
    <p class="note" style="color:var(--ink-3);margin-top:8px">Se il pulsante non funziona, tocca il riquadro qui sopra per selezionare tutto e copia a mano.</p>`;

  document.getElementById('v-peso').innerHTML = h;
}

function addPeso(){
  const d = document.getElementById('pData').value;
  const v = parseFloat(String(document.getElementById('pKg').value).replace(',','.'));
  if(!d || isNaN(v) || v<30 || v>300){ toast('Inserisci un peso valido'); return; }
  S.pesi = S.pesi.filter(x=>x.d!==d);                 // una pesata per giorno
  S.pesi.push({d, v:Math.round(v*10)/10});
  S.pesi.sort((a,b)=>a.d<b.d?-1:1);
  Store.set('pesi', S.pesi);
  document.getElementById('pKg').value='';
  renderPeso(); toast('Pesata salvata');
}
function delPeso(d){
  S.pesi = S.pesi.filter(x=>x.d!==d);
  Store.set('pesi', S.pesi); renderPeso(); toast('Pesata eliminata');
}
async function copiaPeso(){
  const t = testoExport();
  try{
    await navigator.clipboard.writeText(t);
    toast('Copiato negli appunti');
  }catch(e){
    const box = document.getElementById('expBox');
    box.focus(); box.select();
    try{ document.execCommand('copy'); toast('Copiato negli appunti'); }
    catch(_){ toast('Seleziona il testo e copia a mano'); }
  }
}
let tTimer;
function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('on');
  clearTimeout(tTimer); tTimer = setTimeout(()=>el.classList.remove('on'), 1900);
}

     <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="${t.p}"/></svg>
     <span>${t.l}</span>
   </button>`).join('');

function go(id){
  cur = id;
  TABS.forEach(t=>{
    document.getElementById('v-'+t.id).classList.toggle('on', t.id===id);
    document.getElementById('tab-'+t.id).classList.toggle('on', t.id===id);
  });
  window.scrollTo(0,0);
}

/* ══════════════════════════════════════════════════════════
   15. MANIFEST PWA (inline)
   ══════════════════════════════════════════════════════════ */
(function(){
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><rect width="512" height="512" rx="112" fill="#16261F"/><circle cx="256" cy="256" r="150" fill="none" stroke="#3E6B58" stroke-width="30"/><path d="M256 106a150 150 0 01130 75" stroke="#E0A32E" stroke-width="30" fill="none" stroke-linecap="round"/><circle cx="256" cy="256" r="52" fill="#F2F5F0"/></svg>`;
  const icon = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svg)));
  const mfst = {name:'Piano Alimentare', short_name:'Piano Alimentare', start_url:'.', scope:'.',
    display:'standalone', orientation:'portrait', background_color:'#16261F', theme_color:'#16261F',
    icons:[{src:icon, sizes:'any', type:'image/svg+xml', purpose:'any maskable'}]};
  try{
    document.getElementById('mf').href = URL.createObjectURL(new Blob([JSON.stringify(mfst)],{type:'application/manifest+json'}));
    const l = document.createElement('link'); l.rel='apple-touch-icon'; l.href=icon; document.head.appendChild(l);
  }catch(e){}
})();

/* ══════════════════════════════════════════════════════════
   16. AVVIO
   ══════════════════════════════════════════════════════════ */
(async function(){
  S.dieta    = await Store.get('dieta')    || null;
  S.start    = S.dieta ? iso(mondayOf(new Date(S.dieta+'T00:00:00'))) : (await Store.get('start') || iso(mondayOf(new Date())));
  S.scope    = await Store.get('scope')    || 'cur';
  S.pesi     = await Store.get('pesi')     || [];
  S.turni    = await Store.get('turni')    || {};
  S.nuoto    = await Store.get('nuoto')    || {};
  S.cenaPian = await Store.get('cenaPian') || {};
  S.conf     = await Store.get('conf')     || {};
  // versione dei dati: la dispensa della vecchia versione usava altre unità (es. tonno in grammi), si riparte da zero
  if(await Store.get('ver') !== 3){ S.pantry = {}; Store.set('pantry', {}); Store.set('ver', 3); }
  else S.pantry = await Store.get('pantry') || {};
  S.planWeek = pos().w;
  drawHeader(); renderOggi(); renderPiano(); renderRicette(); renderDispensa(); renderPeso();
})();

document.addEventListener('keydown', e => { if(e.key==='Escape') closeSheet(); });
</script>

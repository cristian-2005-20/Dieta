<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Piano Alimentare</title>
<meta name="theme-color" content="#16261F">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Piano Alimentare">
<meta name="description" content="Piano alimentare ciclico di 4 settimane: cosa mangiare, come prepararlo e cosa comprare.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Piano Alimentare">
<meta property="og:title" content="Piano Alimentare">
<meta property="og:description" content="Piano ciclico di 4 settimane: cosa mangiare oggi, ricette passo passo e lista della spesa.">
<meta property="og:url" content="https://cristian-2005-20.github.io/Dieta/">
<meta property="og:image" content="https://cristian-2005-20.github.io/Dieta/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Piano Alimentare">
<meta name="twitter:description" content="Piano ciclico di 4 settimane: cosa mangiare oggi, ricette passo passo e lista della spesa.">
<meta name="twitter:image" content="https://cristian-2005-20.github.io/Dieta/og.png">
<link id="mf" rel="manifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F2F5F0;
  --card:#FFFFFF;
  --ink:#16261F;
  --ink-2:#5A6B62;
  --ink-3:#93A29A;
  --line:#DFE6DE;
  --basil:#2F6B4F;
  --basil-soft:#E6F0E9;
  --saffron:#E0A32E;
  --saffron-soft:#FBF0D8;
  --plum:#7B3560;
  --plum-soft:#F4E7EF;
  --display:'Familjen Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;
  --body:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace;
  --r:14px;
  --nav-h:64px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--paper);color:var(--ink);
  font-family:var(--body);font-size:15px;line-height:1.5;
  padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom));
  overscroll-behavior-y:none;
}
h1,h2,h3,h4{font-family:var(--display);margin:0;letter-spacing:-.015em;line-height:1.15}
button{font-family:inherit;font-size:inherit;color:inherit;border:0;background:none;cursor:pointer}
input{font-family:inherit;font-size:inherit;color:inherit}

/* ── header ─────────────────────────── */
.top{
  position:sticky;top:0;z-index:20;background:var(--ink);color:#F2F5F0;
  padding:calc(14px + env(safe-area-inset-top)) 18px 14px;
}
.top-row{display:flex;align-items:center;gap:14px}
.eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#8FA89B}
.top h1{font-size:21px;font-weight:600;margin-top:2px}
.top .sub{font-size:12.5px;color:#A8BCB0;margin-top:3px}

/* signature: the 28-day cycle ring */
.ring{width:62px;height:62px;flex:0 0 62px}
.ring .track{stroke:#2B4038;stroke-width:5;fill:none}
.ring .seg{stroke-width:5;fill:none;stroke-linecap:butt}
.ring .done{stroke:#3E6B58}
.ring .cook{stroke:var(--saffron)}
.ring .now{stroke:#F2F5F0}
.ring text{font-family:var(--mono);font-size:15px;font-weight:700;fill:#F2F5F0}
.ring tspan.sm{font-size:7px;fill:#8FA89B}

/* ── layout ─────────────────────────── */
.view{display:none;padding:18px 16px 28px;max-width:640px;margin:0 auto}
.view.on{display:block;animation:in .22s ease}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.sec-label{
  font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--ink-3);margin:26px 0 10px;display:flex;align-items:center;gap:10px;
}
.sec-label::after{content:"";flex:1;height:1px;background:var(--line)}
.view > .sec-label:first-child{margin-top:0}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.card + .card{margin-top:10px}

/* ── meal cards ─────────────────────── */
.meal{width:100%;text-align:left;display:block;background:var(--card);border:1px solid var(--line);
  border-radius:var(--r);padding:15px 16px;margin-bottom:10px;transition:border-color .15s,transform .1s}
.meal:active{transform:scale(.99)}
.meal:hover{border-color:#C5D3C8}
.meal-top{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.meal-slot{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--basil)}
.meal-kcal{font-family:var(--mono);font-size:11px;color:var(--ink-3)}
.meal h3{font-size:17px;font-weight:600;margin-top:6px}
.meal .ing{font-size:13px;color:var(--ink-2);margin-top:6px}
.meal .eta{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);margin-top:5px;letter-spacing:.02em}
.meal .go{font-size:12px;color:var(--basil);font-weight:600;margin-top:9px;display:inline-flex;align-items:center;gap:5px}

.meal.free{background:var(--plum-soft);border-color:#E4CEDC}
.meal.free .meal-slot{color:var(--plum)}
.meal.free h3{color:var(--plum)}

.pill{display:inline-block;font-family:var(--mono);font-size:10px;letter-spacing:.1em;
  text-transform:uppercase;padding:3px 8px;border-radius:20px;background:var(--basil-soft);color:var(--basil)}

/* cook-today banner */
.cook-note{background:var(--saffron-soft);border:1px solid #EDDCB4;border-radius:var(--r);padding:14px 16px;margin-bottom:14px}
.cook-note .h{font-family:var(--display);font-weight:600;font-size:15px;display:flex;align-items:center;gap:8px}
.cook-note p{margin:6px 0 0;font-size:13.5px;color:#7A5F1E}

/* breakfast switcher */
.bfast{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:15px 16px;margin-bottom:10px}
.bfast-opts{display:flex;gap:6px;margin-top:12px}
.bopt{flex:1;border:1px solid var(--line);border-radius:9px;padding:7px 4px;text-align:center;
  font-family:var(--mono);font-size:11px;color:var(--ink-3);transition:.15s}
.bopt.on{background:var(--ink);border-color:var(--ink);color:#F2F5F0}

/* ── recipe detail ──────────────────── */
.sheet{position:fixed;inset:0;z-index:40;background:var(--paper);overflow-y:auto;display:none;
  padding-bottom:calc(40px + env(safe-area-inset-bottom))}
.sheet.on{display:block;animation:up .25s cubic-bezier(.2,.8,.3,1)}
@keyframes up{from{transform:translateY(18px);opacity:0}to{transform:none;opacity:1}}
.sheet-bar{position:sticky;top:0;background:var(--paper);border-bottom:1px solid var(--line);
  padding:calc(12px + env(safe-area-inset-top)) 16px 12px;display:flex;align-items:center;gap:12px;z-index:2}
.sheet-bar button{font-size:14px;font-weight:600;color:var(--basil);display:flex;align-items:center;gap:6px}
.sheet-body{padding:20px 16px 0;max-width:640px;margin:0 auto}
.sheet-body h2{font-size:24px;font-weight:700;line-height:1.12}
.rmeta{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.rmeta span{font-family:var(--mono);font-size:11px;padding:4px 9px;border-radius:20px;
  background:var(--basil-soft);color:var(--basil)}

.ilist{list-style:none;margin:0;padding:0}
.ilist li{display:flex;justify-content:space-between;gap:14px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.ilist li:last-child{border-bottom:0}
.ilist b{font-family:var(--mono);font-weight:700;font-size:13px;white-space:nowrap}
.ilist .free-txt{color:var(--ink-3);font-size:13px;font-style:italic}

.steps{counter-reset:s;list-style:none;margin:0;padding:0}
.steps li{counter-increment:s;position:relative;padding:0 0 20px 40px}
.steps li::before{content:counter(s,decimal-leading-zero);position:absolute;left:0;top:1px;
  font-family:var(--mono);font-size:12px;font-weight:700;color:var(--basil);
  background:var(--basil-soft);width:26px;height:26px;border-radius:50%;
  display:flex;align-items:center;justify-content:center}
.steps li::after{content:"";position:absolute;left:13px;top:31px;bottom:4px;width:1px;background:var(--line)}
.steps li:last-child{padding-bottom:0}
.steps li:last-child::after{display:none}
.steps h4{font-size:14.5px;font-weight:600;margin-bottom:3px}
.steps p{margin:0;font-size:14px;color:var(--ink-2)}

.warn{background:#FDF6E6;border-left:3px solid var(--saffron);border-radius:0 9px 9px 0;
  padding:12px 14px;margin-top:10px;font-size:13.5px;color:#7A5F1E}
.keep{background:var(--basil-soft);border-radius:var(--r);padding:14px 16px;margin-top:8px;font-size:13.5px;color:#255440}
.keep b{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.14em;
  text-transform:uppercase;margin-bottom:5px;font-weight:700}

/* ── plan view ──────────────────────── */
.wk{display:flex;gap:6px;margin-bottom:16px}
.wtab{flex:1;padding:9px 0;border:1px solid var(--line);border-radius:10px;background:var(--card);
  text-align:center;font-family:var(--mono);font-size:11px;color:var(--ink-2);transition:.15s}
.wtab.on{background:var(--ink);border-color:var(--ink);color:#F2F5F0}
.day-row{display:flex;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}
.day-row:last-child{border-bottom:0}
.dtag{flex:0 0 34px;font-family:var(--mono);font-size:11px;font-weight:700;color:var(--ink-3);padding-top:2px}
.dtag.cooking{color:var(--saffron)}
.day-body{flex:1;min-width:0}
.dline{font-size:13.5px;padding:2px 0;display:flex;gap:8px}
.dline i{font-family:var(--mono);font-style:normal;font-size:10px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink-3);flex:0 0 42px;padding-top:3px}
.dline span{color:var(--ink)}
.dline button{text-align:left;color:var(--ink);text-decoration:underline;text-decoration-color:var(--line);
  text-underline-offset:3px}
.dline .lib{color:var(--plum);font-weight:600}

/* ── recipes index ──────────────────── */
.rlink{width:100%;text-align:left;display:flex;justify-content:space-between;align-items:center;gap:12px;
  padding:14px 0;border-bottom:1px solid var(--line)}
.rlink:last-child{border-bottom:0}
.rlink h4{font-size:15px;font-weight:600}
.rlink p{margin:2px 0 0;font-size:12.5px;color:var(--ink-3);font-family:var(--mono)}
.rlink svg{flex:0 0 16px;color:var(--ink-3)}

/* ── pantry ─────────────────────────── */
.scope{display:flex;gap:6px;margin-bottom:6px}
.sbtn{flex:1;padding:9px 4px;border:1px solid var(--line);border-radius:10px;background:var(--card);
  font-family:var(--mono);font-size:10.5px;color:var(--ink-2);text-align:center;transition:.15s}
.sbtn.on{background:var(--basil);border-color:var(--basil);color:#fff}

.buy{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.buy-head{background:var(--ink);color:#F2F5F0;padding:14px 16px;display:flex;justify-content:space-between;align-items:center}
.buy-head h3{font-size:15px;font-weight:600}
.buy-head span{font-family:var(--mono);font-size:11px;color:#8FA89B}
.buy-cat{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink-3);padding:12px 16px 4px;background:var(--paper)}
.buy-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 16px;border-top:1px solid var(--line)}
.buy-row .nm{font-size:14px}
.buy-row .qt{font-family:var(--mono);font-size:13px;font-weight:700;color:var(--saffron);white-space:nowrap}
.ok-state{padding:26px 16px;text-align:center;color:var(--ink-2);font-size:14px}
.ok-state b{display:block;font-family:var(--display);font-size:16px;color:var(--basil);margin-bottom:4px}

.pan-cat{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink-3);margin:20px 0 6px}
.pan-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.pan-row .nm{flex:1;font-size:14px;min-width:0}
.pan-row .need{font-family:var(--mono);font-size:11px;color:var(--ink-3);white-space:nowrap}
.pan-row input{width:74px;padding:7px 8px;border:1px solid var(--line);border-radius:9px;
  background:var(--card);text-align:right;font-family:var(--mono);font-size:13px}
.pan-row input:focus{outline:2px solid var(--basil);outline-offset:-1px;border-color:var(--basil)}
.pan-row .u{font-family:var(--mono);font-size:11px;color:var(--ink-3);width:22px}

.ghost{width:100%;padding:12px;border:1px solid var(--line);border-radius:11px;background:var(--card);
  font-size:13.5px;font-weight:600;color:var(--ink-2);margin-top:16px}
.ghost:active{background:var(--paper)}

/* ── settings / notes ───────────────── */
.kv{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:11px 0;border-bottom:1px solid var(--line)}
.kv:last-child{border-bottom:0}
.kv .k{font-size:14px}
.kv .k small{display:block;color:var(--ink-3);font-size:12px;margin-top:2px}
.kv input[type=date]{padding:7px 9px;border:1px solid var(--line);border-radius:9px;background:var(--card);font-family:var(--mono);font-size:12.5px}
.kv b{font-family:var(--mono);font-size:14px;font-weight:700}
.note{font-size:12.5px;color:var(--ink-2);line-height:1.55}
.note + .note{margin-top:9px}

/* ── bottom nav ─────────────────────── */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);
  border-top:1px solid var(--line);display:flex;
  padding-bottom:env(safe-area-inset-bottom);height:calc(var(--nav-h) + env(safe-area-inset-bottom))}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  color:var(--ink-3);height:var(--nav-h)}
.nav button.on{color:var(--basil)}
.nav svg{width:21px;height:21px}
.nav span{font-family:var(--mono);font-size:9px;letter-spacing:.03em}

.w-in{display:flex;gap:8px;align-items:stretch}
.w-in input{flex:1;min-width:0;padding:12px;border:1px solid var(--line);border-radius:11px;
  background:var(--card);font-family:var(--mono);font-size:15px}
.w-in input[type=date]{flex:1.1;font-size:13px}
.w-in input:focus{outline:2px solid var(--basil);outline-offset:-1px;border-color:var(--basil)}
.w-add{background:var(--basil);color:#fff;border-radius:11px;padding:0 18px;font-weight:600;font-size:14px}
.w-add:active{background:#255440}

.w-big{display:flex;gap:10px;margin:10px 0 0}
.w-stat{flex:1;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:13px 14px}
.w-stat .lbl{font-family:var(--mono);font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3)}
.w-stat .val{font-family:var(--display);font-size:23px;font-weight:700;margin-top:4px;line-height:1}
.w-stat .sub{font-size:11.5px;color:var(--ink-3);margin-top:3px}
.dn{color:var(--basil)} .up{color:#C4562F}

.chart{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 12px 8px}
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .tgt{stroke:var(--saffron);stroke-width:1.5;stroke-dasharray:5 4}
.chart .ln{fill:none;stroke:var(--basil);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.chart .ar{fill:var(--basil);opacity:.07}
.chart .pt{fill:var(--card);stroke:var(--basil);stroke-width:2}
.chart .lastpt{fill:var(--basil);stroke:var(--card);stroke-width:2.5}
.chart text{font-family:var(--mono);font-size:8.5px;fill:var(--ink-3)}

.wk-row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.wk-row:last-child{border-bottom:0}
.wk-row .per{flex:1;font-size:13.5px}
.wk-row .per small{display:block;color:var(--ink-3);font-size:11px;font-family:var(--mono);margin-top:2px}
.wk-row .med{font-family:var(--mono);font-size:14px;font-weight:700}
.wk-row .dlt{font-family:var(--mono);font-size:12px;width:56px;text-align:right}

.p-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.p-row:last-child{border-bottom:0}
.p-row .dt{flex:1;font-family:var(--mono);font-size:12.5px;color:var(--ink-2)}
.p-row .kg{font-family:var(--mono);font-size:14px;font-weight:700}
.p-row .x{color:var(--ink-3);padding:4px 8px;font-size:16px;line-height:1}

.tdee{background:var(--basil-soft);border-radius:var(--r);padding:16px}
.tdee .lbl{font-family:var(--mono);font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--basil)}
.tdee .val{font-family:var(--display);font-size:27px;font-weight:700;color:#1E4634;margin-top:5px;line-height:1}
.tdee p{margin:8px 0 0;font-size:13px;color:#255440;line-height:1.5}

.exp{width:100%;padding:13px;border-radius:11px;background:var(--ink);color:#F2F5F0;
  font-size:14px;font-weight:600;margin-top:10px;display:flex;align-items:center;justify-content:center;gap:8px}
.exp:active{opacity:.85}
.expbox{width:100%;margin-top:10px;padding:12px;border:1px solid var(--line);border-radius:11px;
  background:var(--card);font-family:var(--mono);font-size:11.5px;line-height:1.5;min-height:150px;resize:vertical}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + 22px + env(safe-area-inset-bottom));
  background:var(--ink);color:#F2F5F0;padding:11px 20px;border-radius:24px;font-size:13.5px;font-weight:600;
  z-index:60;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
.empty{text-align:center;padding:30px 16px;color:var(--ink-3);font-size:14px}
.empty b{display:block;font-family:var(--display);font-size:16px;color:var(--ink-2);margin-bottom:5px}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<header class="top">
  <div class="top-row">
    <svg class="ring" viewBox="0 0 100 100" id="ring" aria-hidden="true"></svg>
    <div style="min-width:0">
      <div class="eyebrow" id="hEyebrow">Piano Alimentare</div>
      <h1 id="hTitle">—</h1>
      <div class="sub" id="hSub">—</div>
    </div>
  </div>
</header>

<main>
  <section class="view on" id="v-oggi"></section>
  <section class="view" id="v-piano"></section>
  <section class="view" id="v-ricette"></section>
  <section class="view" id="v-dispensa"></section>
  <section class="view" id="v-peso"></section>
</main>

<div class="sheet" id="sheet">
  <div class="sheet-bar">
    <button onclick="closeSheet()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      Indietro
    </button>
  </div>
  <div class="sheet-body" id="sheetBody"></div>
</div>

<div class="toast" id="toast"></div>
<nav class="nav" id="nav"></nav>

<script>
/* ══════════════════════════════════════════════════════════
   1. INGREDIENTI
   ══════════════════════════════════════════════════════════ */
const ING = {
  latte:      {n:'Latte parz. scremato',            u:'ml', c:'Latticini', k:46,  p:3.3, ca:4.9, g:1.6},
  grana:      {n:'Grana / Parmigiano',              u:'g',  c:'Latticini', k:392, p:33,  ca:0,   g:28},

function nutri(ing){
  let o={kcal:0,p:0,c:0,g:0};
  for(const key in ing){
    const n=ING[key]; if(!n) continue;
    const f = n.pz ? ing[key] : ing[key]/100;
    o.kcal+=n.k*f; o.p+=n.p*f; o.c+=n.ca*f; o.g+=n.g*f;
  }
  for(const k in o) o[k]=Math.round(o[k]);
  return o;
}

   5. STORAGE  (window.storage in Claude · localStorage da file · memoria)
   ══════════════════════════════════════════════════════════ */
const mem = {};
const Store = {
  async get(k){
    if(window.storage){
      try{ const r = await window.storage.get(k, false); if(r&&r.value) return JSON.parse(r.value); }catch(e){}
    }
    try{ const v = localStorage.getItem('ciclo:'+k); if(v) return JSON.parse(v); }catch(e){}
    return mem[k] ?? null;
  },
  async set(k,v){
    mem[k]=v;
    if(window.storage){
      try{ await window.storage.set(k, JSON.stringify(v), false); return; }catch(e){}
    }
    try{ localStorage.setItem('ciclo:'+k, JSON.stringify(v)); }catch(e){}
  }
};

/* ══════════════════════════════════════════════════════════
   6. STATO
   ══════════════════════════════════════════════════════════ */
let S = { start:null, pantry:{}, scope:'cur', planWeek:0, bfast:{}, pesi:[] };

function mondayOf(d){
  const x = new Date(d); x.setHours(0,0,0,0);
  x.setDate(x.getDate() - ((x.getDay()+6)%7));
  return x;
}
function iso(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }

function pos(){
  const today = new Date(); today.setHours(0,0,0,0);
  const start = mondayOf(S.start ? new Date(S.start+'T00:00:00') : today);
  const days  = Math.floor((today - start)/86400000);
  const n     = ((days % 28) + 28) % 28;
  return { w: Math.floor(n/7), d: n%7, abs:n, past: days < 0 };
}

/* ══════════════════════════════════════════════════════════
   7. CALCOLO FABBISOGNI
   ══════════════════════════════════════════════════════════ */
function weekNeeds(wi){
  const w = WEEKS[wi], out = {};
  const add = (ing, mult=1) => { for(const k in ing) out[k] = (out[k]||0) + ing[k]*mult; };

  add(COLAZIONE.ing, 7);                                   // colazione fissa, 7 giorni
  for(let d=0; d<7; d++){ add(SM[w.sm[d%3]].ing); add(SP[w.sp[d%3]].ing); }

  w.bl.forEach(b=>{
    if(b.pranzo) add(R[b.pranzo].ing, b.pranzi.length);
    if(b.cena)   add(R[b.cena].ing, b.cene.filter(g => g !== FREE_DAY).length);
  });
  return out;
}
function scopeNeeds(){
  const p = pos();
  if(S.scope==='cur')  return weekNeeds(p.w);
  if(S.scope==='next') return weekNeeds((p.w+1)%4);
  const out = {};
  for(let i=0;i<4;i++){ const n=weekNeeds(i); for(const k in n) out[k]=(out[k]||0)+n[k]; }
  return out;
}
function roundBuy(v,u){
  if(u==='pz') return Math.ceil(v);
  if(v<50) return Math.ceil(v/5)*5;
  return Math.ceil(v/10)*10;
}

function drawRing(){
  const p = pos(), el = document.getElementById('ring');
  const cx=50, cy=50, r=41, N=28, gap=2.6, step=360/N;
  const arc = (i,cls) => {
    const a0 = -90 + i*step + gap/2, a1 = -90 + (i+1)*step - gap/2;
    const rad = a => (a*Math.PI)/180;
    const x0 = cx + r*Math.cos(rad(a0)), y0 = cy + r*Math.sin(rad(a0));
    const x1 = cx + r*Math.cos(rad(a1)), y1 = cy + r*Math.sin(rad(a1));
    return `<path class="seg ${cls}" d="M${x0.toFixed(2)} ${y0.toFixed(2)} A${r} ${r} 0 0 1 ${x1.toFixed(2)} ${y1.toFixed(2)}"/>`;
  };
  let s = `<circle class="track" cx="50" cy="50" r="41"/>`;
  for(let i=0;i<N;i++){
    const day = i%7;
    let cls = '';
    if(i === p.abs) cls = 'now';
    else if(i < p.abs) cls = 'done';
    else if(PREP_DAYS[day]) cls = 'cook';
    if(cls) s += arc(i,cls);
  }
  s += `<text x="50" y="47" text-anchor="middle">${p.abs+1}</text>`;
  s += `<text x="50" y="59" text-anchor="middle"><tspan class="sm">DI 28</tspan></text>`;
  el.innerHTML = s;
}
function drawHeader(){
  const p = pos(), w = WEEKS[p.w];
  const dt = new Date(); 
  document.getElementById('hEyebrow').textContent = `Settimana ${w.n} · ${w.tema}`;
  document.getElementById('hTitle').textContent   = GG[p.d];
  document.getElementById('hSub').textContent     = dt.toLocaleDateString('it-IT',{day:'numeric',month:'long'});
  drawRing();
}

function pranzoDi(w,d){ return w.bl.find(b => b.pranzi.includes(d)); }
function cenaDi(w,d){   return w.bl.find(b => b.cene.includes(d)); }
/* giorni di frigo fra la cottura e il pasto */
function eta(b,d,tipo){
  if(tipo==='cena' && d===b.cook && !b.prev) return 0;
  let g = d - b.cook; if(b.prev || g < 0) g += 7;
  return g;
}
function etaTxt(g){ return g===0 ? 'appena cucinato' : (g===1 ? 'cucinato ieri sera' : `cucinato ${g} giorni fa`); }

function ingLine(r){
  return Object.entries(r.ing).map(([k,v]) => `${ING[k].n.split(' (')[0].toLowerCase()} ${v}${ING[k].u==='pz'?'':' '+ING[k].u}`).join(' · ');
}

function renderOggi(){
  const p = pos(), w = WEEKS[p.w];
  const bp = pranzoDi(w,p.d), bc = cenaDi(w,p.d);
  const isFree = p.d === FREE_DAY;
  const sm = SM[w.sm[p.d%3]], sp = SP[w.sp[p.d%3]];
  const pr = R[bp.pranzo], ce = bc ? R[bc.cena] : null;
  const nC=nutri(COLAZIONE.ing), nSM=nutri(sm.ing), nP=nutri(pr.ing), nSP=nutri(sp.ing);
  const nE = (isFree || !ce) ? {kcal:0,p:0,c:0,g:0} : nutri(ce.ing);
  const tot = {kcal:nC.kcal+nSM.kcal+nP.kcal+nSP.kcal+nE.kcal,
               p:nC.p+nSM.p+nP.p+nSP.p+nE.p,
               c:nC.c+nSM.c+nP.c+nSP.c+nE.c,
               g:nC.g+nSM.g+nP.g+nSP.g+nE.g};

  let h = '';

  if(PREP_DAYS[p.d]){
    const sess = PREP_DAYS[p.d].map(id => w.bl.find(x=>x.id===id)).filter(Boolean);
    const righe = sess.map(nb=>{
      const parti = [];
      if(nb.pranzo && nb.pranzi.length) parti.push(`${nb.pranzi.length} × <b>${R[nb.pranzo].nome}</b>`);
      if(nb.cena){
        const fresche = nb.cene.filter(d=>d===p.d).length, dopo = nb.cene.length - fresche;
        if(fresche && dopo) parti.push(`<b>${R[nb.cena].nome}</b> per stasera + ${dopo} porzione${dopo>1?'i':''}`);
        else if(fresche)    parti.push(`<b>${R[nb.cena].nome}</b> per stasera`);
        else                parti.push(`${nb.cene.length} × <b>${R[nb.cena].nome}</b>`);
      }
      return parti.join(' e ');
    });
    const ultimo = Math.max(...sess.flatMap(x=>[...x.pranzi,...x.cene].map(d=>{
      let g=d-p.d; if(g<0) g+=7; return g;})));
    h += `<div class="cook-note">
      <div class="h">Stasera si cucina</div>
      <p>${righe.join('. ')}. Ti copre ${ultimo===0?'per oggi':`fino a ${GG[(p.d+ultimo)%7].toLowerCase()}`}.</p>
    </div>`;
  }

  h += simpleCard('Colazione', COLAZIONE, nC);
  h += snackCard('Spuntino · mattina', sm, nSM, 'sm', w.sm, p.d%3);
  h += mealCard('Pranzo', bp.pranzo, etaTxt(eta(bp,p.d,'pranzo')));
  h += snackCard('Spuntino · pomeriggio', sp, nSP, 'sp', w.sp, p.d%3);
  h += isFree
    ? `<div class="meal free">
         <div class="meal-top"><span class="meal-slot">Cena · sabato</span><span class="meal-kcal">—</span></div>
         <h3>Cena libera</h3>
         <div class="ing" style="color:#7B3560;opacity:.85">Mangia quello che vuoi, senza pesare niente.</div>
       </div>`
    : mealCard('Cena', bc.cena, etaTxt(eta(bc,p.d,'cena')));

  h += `<div class="sec-label">Totale della giornata</div>
    <div class="card">
      <div class="kv"><span class="k">Calorie${isFree?' <small>la cena libera non è conteggiata</small>':''}</span><b>${tot.kcal} kcal</b></div>
      <div class="kv"><span class="k">Proteine</span><b>${tot.p} g</b></div>
      <div class="kv"><span class="k">Carboidrati</span><b>${tot.c} g</b></div>
      <div class="kv"><span class="k">Grassi</span><b>${tot.g} g</b></div>
      <div class="kv"><span class="k">Acqua<small>almeno, di più nei giorni di nuoto</small></span><b>2 L</b></div>
    </div>`;

  document.getElementById('v-oggi').innerHTML = h;
}

function ingTxt(ing){

}

function snackCard(slot, item, n, tipo, opzioni, idx){
  const src = tipo==='sm' ? SM : SP;

function pickSnack(tipo, i){
  const p = pos(), w = WEEKS[p.w];
  const lista = tipo==='sm' ? w.sm : w.sp;
  const day = p.d;
  // ruota la lista della settimana in modo che l'opzione scelta capiti oggi
  const shift = ((i - (day%3)) % 3 + 3) % 3;
  if(shift){ for(let n=0;n<shift;n++) lista.push(lista.shift()); }
  renderOggi();
}

  document.getElementById('v-piano').innerHTML = h;
}

function renderDispensa(){
  const needs = scopeNeeds();
  const labels = {cur:'Questa settimana', next:'La prossima', all:'Tutte e 4'};

  let h = `<div class="sec-label">Calcola per</div>
  <div class="scope">${['cur','next','all'].map(s=>
    `<button class="sbtn ${S.scope===s?'on':''}" onclick="setScope('${s}')">${labels[s].toUpperCase()}</button>`).join('')}</div>`;

  // lista della spesa
  const missing = [];
  for(const k in needs){
    const have = S.pantry[k] || 0;
    const gap  = needs[k] - have;
    if(gap > 0.001) missing.push([k, roundBuy(gap, ING[k].u)]);
  }

  h += `<div class="sec-label">Da comprare</div><div class="buy">
    <div class="buy-head"><h3>Lista della spesa</h3><span>${missing.length} VOCI</span></div>`;
  if(!missing.length){
    h += `<div class="ok-state"><b>Dispensa a posto</b>Hai già tutto quello che serve per ${labels[S.scope].toLowerCase()}.</div>`;
  }else{
    CATS.forEach(c=>{
      const rows = missing.filter(([k])=>ING[k].c===c);
      if(!rows.length) return;
      h += `<div class="buy-cat">${c}</div>`;
      rows.forEach(([k,q]) => h += `<div class="buy-row">
        <span class="nm">${ING[k].n}</span><span class="qt">${q} ${ING[k].u}</span></div>`);
    });
  }
  h += `</div>`;

  // dispensa
  h += `<div class="sec-label">Cosa hai in casa</div>
  <div class="card"><p class="note" style="margin-bottom:4px">Scrivi le quantità che hai già. La lista qui sopra si aggiorna da sola sottraendole al fabbisogno.</p></div>`;

  CATS.forEach(c=>{
    const keys = Object.keys(ING).filter(k=>ING[k].c===c && needs[k]);
    if(!keys.length) return;
    h += `<div class="pan-cat">${c}</div><div class="card" style="padding:4px 16px">`;
    keys.forEach(k=>{
      h += `<div class="pan-row">
        <span class="nm">${ING[k].n}<br><span class="need">serve ${Math.round(needs[k])} ${ING[k].u}</span></span>
        <input type="number" inputmode="decimal" min="0" step="any" value="${S.pantry[k] ?? ''}"
               placeholder="0" oninput="setPan('${k}',this.value)" aria-label="${ING[k].n}">
        <span class="u">${ING[k].u}</span>
      </div>`;
    });
    h += `</div>`;
  });

  h += `<button class="ghost" onclick="clearPan()">Azzera la dispensa</button>`;

  document.getElementById('v-dispensa').innerHTML = h;
}

function setPan(k,v){
  const n = parseFloat(v);
  if(v==='' || isNaN(n)) delete S.pantry[k]; else S.pantry[k]=Math.max(0,n);
  Store.set('pantry', S.pantry);

  panTimer = setTimeout(()=>{                       // aggiorna solo la lista, senza perdere il focus
    const needs = scopeNeeds(); const missing=[];

    const box = document.querySelector('.buy'); if(!box) return;
    let inner = `<div class="buy-head"><h3>Lista della spesa</h3><span>${missing.length} VOCI</span></div>`;
    if(!missing.length){

/* ══════════════════════════════════════════════════════════
   13-bis. PESO
   ══════════════════════════════════════════════════════════ */
const OBIETTIVO = 85;

/* media calorica reale del piano, calcolata dalle ricette */
function mediaPiano(){
  const nC = nutri(COLAZIONE.ing); let tot=0, n=0;
  WEEKS.forEach(w=>{
    for(let d=0; d<7; d++){
      if(d===FREE_DAY) continue;
      const a=nutri(SM[w.sm[d%3]].ing), s2=nutri(SP[w.sp[d%3]].ing);
      const pr=nutri(R[pranzoDi(w,d).pranzo].ing), ce=nutri(R[cenaDi(w,d).cena].ing);
      tot += nC.kcal+a.kcal+pr.kcal+s2.kcal+ce.kcal; n++;
    }});
  return Math.round(tot/n);
}

const dt2it = iso => { const [y,m,g]=iso.split('-'); return `${g}/${m}`; };
const kg = v => v.toFixed(1).replace('.',',');

/* raggruppa le pesate per settimana (lunedì–domenica) */
function settimane(){
  const out = {};
  S.pesi.forEach(x=>{
    const d = new Date(x.d+'T00:00:00');
    const lun = new Date(d); lun.setDate(d.getDate() - ((d.getDay()+6)%7));
    const k = iso(lun);
    (out[k] = out[k] || []).push(x.v);
  });
  return Object.keys(out).sort().map(k=>{
    const v = out[k];
    return {inizio:k, n:v.length, media: v.reduce((a,b)=>a+b,0)/v.length};
  });
}

/* pendenza in kg/giorno con una regressione lineare sui punti */
function trend(){
  const p = S.pesi;
  if(p.length < 4) return null;
  const t0 = new Date(p[0].d+'T00:00:00').getTime();
  const xs = p.map(x=>(new Date(x.d+'T00:00:00').getTime()-t0)/86400000);
  const giorni = xs[xs.length-1];
  if(giorni < 13) return null;                       // servono almeno 2 settimane
  const ys = p.map(x=>x.v);
  const mx = xs.reduce((a,b)=>a+b,0)/xs.length, my = ys.reduce((a,b)=>a+b,0)/ys.length;
  let num=0, den=0;
  xs.forEach((x,i)=>{ num += (x-mx)*(ys[i]-my); den += (x-mx)*(x-mx); });
  if(!den) return null;
  return {slope: num/den, giorni: Math.round(giorni), n: p.length};
}

function graficoSVG(){
  const p = S.pesi;
  if(p.length < 2) return '';
  const W=320, H=140, ml=30, mr=8, mt=10, mb=18;
  const t0 = new Date(p[0].d+'T00:00:00').getTime();
  const xs = p.map(x=>(new Date(x.d+'T00:00:00').getTime()-t0)/86400000);
  const ys = p.map(x=>x.v);
  const span = Math.max(xs[xs.length-1], 1);
  let lo = Math.min(...ys), hi = Math.max(...ys);
  if(OBIETTIVO >= lo-3 && OBIETTIVO <= hi+3){ lo = Math.min(lo, OBIETTIVO); hi = Math.max(hi, OBIETTIVO); }
  const pad = Math.max((hi-lo)*0.18, 0.6); lo -= pad; hi += pad;
  const X = v => ml + (v/span)*(W-ml-mr);
  const Y = v => mt + (1-(v-lo)/(hi-lo))*(H-mt-mb);
  const pts = xs.map((x,i)=>[X(x), Y(ys[i])]);
  const linea = pts.map((q,i)=>(i?'L':'M')+q[0].toFixed(1)+' '+q[1].toFixed(1)).join(' ');
  const area = linea + ` L${pts[pts.length-1][0].toFixed(1)} ${H-mb} L${pts[0][0].toFixed(1)} ${H-mb} Z`;
  let g = '';
  [0,0.5,1].forEach(f=>{ const v=lo+(hi-lo)*f, y=Y(v);
    g += `<line class="gl" x1="${ml}" y1="${y.toFixed(1)}" x2="${W-mr}" y2="${y.toFixed(1)}"/>`;
    g += `<text x="${ml-5}" y="${(y+3).toFixed(1)}" text-anchor="end">${v.toFixed(1)}</text>`; });
  if(OBIETTIVO>lo && OBIETTIVO<hi){
    const y=Y(OBIETTIVO);
    g += `<line class="tgt" x1="${ml}" y1="${y.toFixed(1)}" x2="${W-mr}" y2="${y.toFixed(1)}"/>`;
    g += `<text x="${W-mr}" y="${(y-5).toFixed(1)}" text-anchor="end" fill="#E0A32E">obiettivo ${OBIETTIVO}</text>`;
  }
  g += `<path class="ar" d="${area}"/><path class="ln" d="${linea}"/>`;
  const salta = Math.ceil(pts.length/22);
  pts.forEach((q,i)=>{ if(i%salta && i!==pts.length-1) return;
    g += `<circle class="${i===pts.length-1?'lastpt':'pt'}" cx="${q[0].toFixed(1)}" cy="${q[1].toFixed(1)}" r="${i===pts.length-1?4:3}"/>`; });
  g += `<text x="${ml}" y="${H-5}">${dt2it(p[0].d)}</text>`;
  g += `<text x="${W-mr}" y="${H-5}" text-anchor="end">${dt2it(p[p.length-1].d)}</text>`;
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}">${g}</svg></div>`;
}

function testoExport(){
  const p = S.pesi;
  if(!p.length) return 'Nessuna pesata registrata.';
  let t = `PESO — Piano Alimentare\nPiano seguito: ~${mediaPiano()} kcal/giorno\n\nPESATE (${p.length})\n`;
  p.forEach(x=> t += `${x.d}  ${kg(x.v)} kg\n`);
  const w = settimane();
  if(w.length){
    t += `\nMEDIE SETTIMANALI\n`;
    w.forEach((x,i)=>{
      const d = i ? x.media - w[i-1].media : null;
      t += `Sett. dal ${x.inizio}: ${kg(x.media)} kg (${x.n} pesate)` + (d!==null ? `  ${d>=0?'+':''}${kg(d)}` : '') + `\n`;
    });
  }
  const tr = trend();
  if(tr){
    const sett = tr.slope*7, stima = Math.round(mediaPiano() - tr.slope*7700);
    t += `\nANDAMENTO\nVariazione: ${sett>=0?'+':''}${kg(sett)} kg a settimana su ${tr.giorni} giorni\n`;
    t += `Fabbisogno stimato dal trend: ~${stima} kcal/giorno\n`;
  } else {
    t += `\nANDAMENTO\nServono almeno 4 pesate su 14 giorni per stimare il fabbisogno.\n`;
  }
  return t;
}

function renderPeso(){
  const p = S.pesi, ultimo = p.length ? p[p.length-1] : null;
  const primo = p.length ? p[0] : null;
  let h = `<div class="sec-label">Registra una pesata</div>
    <div class="w-in">
      <input type="date" id="pData" value="${iso(new Date())}" max="${iso(new Date())}">
      <input type="number" id="pKg" inputmode="decimal" step="0.1" min="30" max="300" placeholder="kg">
      <button class="w-add" onclick="addPeso()">Salva</button>
    </div>
    <p class="note" style="margin-top:9px;color:var(--ink-3)">Pesati al mattino, a digiuno, dopo il bagno. Il singolo numero oscilla anche di un chilo per acqua e sale: conta la media della settimana.</p>`;

  if(!p.length){
    h += `<div class="card" style="margin-top:16px"><div class="empty"><b>Nessuna pesata</b>Registra il primo peso per iniziare a vedere l'andamento.</div></div>`;
    document.getElementById('v-peso').innerHTML = h;
    return;
  }

  const diff = p.length>1 ? ultimo.v - primo.v : 0;
  h += `<div class="w-big">
    <div class="w-stat"><div class="lbl">Ultimo</div><div class="val">${kg(ultimo.v)}</div><div class="sub">${dt2it(ultimo.d)}</div></div>
    <div class="w-stat"><div class="lbl">Dall'inizio</div><div class="val ${diff<0?'dn':(diff>0?'up':'')}">${diff>0?'+':''}${kg(diff)}</div><div class="sub">${p.length} pesate</div></div>
    <div class="w-stat"><div class="lbl">All'obiettivo</div><div class="val">${kg(Math.max(0, ultimo.v-OBIETTIVO))}</div><div class="sub">restano</div></div>
  </div>`;

  if(p.length>1){ h += `<div class="sec-label">Andamento</div>` + graficoSVG(); }

  const tr = trend();
  h += `<div class="sec-label">Il tuo fabbisogno reale</div>`;
  if(tr){
    const sett = tr.slope*7, stima = Math.round(mediaPiano() - tr.slope*7700);
    const ok = sett <= -0.35 && sett >= -0.9;
    h += `<div class="tdee">
      <div class="lbl">Stimato dal tuo andamento</div>
      <div class="val">~${stima} kcal</div>
      <p>Stai facendo <b>${sett>=0?'+':''}${kg(sett)} kg a settimana</b> su ${tr.giorni} giorni, mangiando circa ${mediaPiano()} kcal.
      ${ok ? 'Il ritmo è quello giusto, non cambiare niente.'
           : (sett > -0.35 ? (sett>=0 ? 'Non stai perdendo peso: il piano va abbassato di 200 kcal.' : 'Stai scendendo lentamente: valuta di togliere 150 kcal.')
                           : 'Stai scendendo in fretta: aggiungi 150–200 kcal per non perdere massa muscolare.')}</p>
    </div>`;
  } else {
    const mancano = Math.max(0, 4 - p.length);
    h += `<div class="card"><p class="note">Servono almeno 4 pesate distribuite su 14 giorni.
      ${mancano ? `Ne mancano ancora ${mancano}.` : 'Continua a pesarti: il periodo non copre ancora due settimane.'}
      Poi qui comparirà la stima del tuo fabbisogno reale, calcolata dal peso e non da una formula.</p></div>`;
  }

  const w = settimane();
  if(w.length>1){
    h += `<div class="sec-label">Medie settimanali</div><div class="card">`;
    w.forEach((x,i)=>{
      const d = i ? x.media - w[i-1].media : null;
      h += `<div class="wk-row">
        <div class="per">Settimana dal ${dt2it(x.inizio)}<small>${x.n} pesat${x.n===1?'a':'e'}</small></div>
        <div class="med">${kg(x.media)}</div>
        <div class="dlt ${d===null?'':(d<0?'dn':(d>0?'up':''))}">${d===null?'—':(d>0?'+':'')+kg(d)}</div>
      </div>`;
    });
    h += `</div>`;
  }

  h += `<div class="sec-label">Storico</div><div class="card">`;
  [...p].reverse().forEach(x=>{
    h += `<div class="p-row"><span class="dt">${x.d.split('-').reverse().join('/')}</span>
      <span class="kg">${kg(x.v)} kg</span>
      <button class="x" onclick="delPeso('${x.d}')" aria-label="elimina">×</button></div>`;
  });
  h += `</div>`;

  h += `<div class="sec-label">Esporta</div>
    <button class="exp" onclick="copiaPeso()">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>
      Copia tutto negli appunti
    </button>
    <textarea class="expbox" id="expBox" readonly onclick="this.select()">${testoExport().replace(/</g,'&lt;')}</textarea>
    <p class="note" style="color:var(--ink-3);margin-top:8px">Se il pulsante non funziona, tocca il riquadro qui sopra per selezionare tutto e copia a mano.</p>`;

  document.getElementById('v-peso').innerHTML = h;
}

function addPeso(){
  const d = document.getElementById('pData').value;
  const v = parseFloat(String(document.getElementById('pKg').value).replace(',','.'));
  if(!d || isNaN(v) || v<30 || v>300){ toast('Inserisci un peso valido'); return; }
  S.pesi = S.pesi.filter(x=>x.d!==d);                 // una pesata per giorno
  S.pesi.push({d, v:Math.round(v*10)/10});
  S.pesi.sort((a,b)=>a.d<b.d?-1:1);
  Store.set('pesi', S.pesi);
  document.getElementById('pKg').value='';
  renderPeso(); toast('Pesata salvata');
}
function delPeso(d){
  S.pesi = S.pesi.filter(x=>x.d!==d);
  Store.set('pesi', S.pesi); renderPeso(); toast('Pesata eliminata');
}
async function copiaPeso(){
  const t = testoExport();
  try{
    await navigator.clipboard.writeText(t);
    toast('Copiato negli appunti');
  }catch(e){
    const box = document.getElementById('expBox');
    box.focus(); box.select();
    try{ document.execCommand('copy'); toast('Copiato negli appunti'); }
    catch(_){ toast('Seleziona il testo e copia a mano'); }
  }
}
let tTimer;
function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('on');
  clearTimeout(tTimer); tTimer = setTimeout(()=>el.classList.remove('on'), 1900);
}

   14. NAVIGAZIONE
   ══════════════════════════════════════════════════════════ */
const TABS = [
  {id:'oggi',     l:'OGGI',     p:'M12 2v3M12 19v3M2 12h3M19 12h3M12 7a5 5 0 100 10 5 5 0 000-10z'},
  {id:'piano',    l:'PIANO',    p:'M3 6h18M3 12h18M3 18h18'},
  {id:'ricette',  l:'RICETTE',  p:'M4 3v18M4 3a4 4 0 014 4v4a4 4 0 01-4 4M16 3v7a3 3 0 003 3h1M20 3v18'},
  {id:'dispensa', l:'SPESA',    p:'M3 4h2l2.4 11.2a2 2 0 002 1.6h7.7a2 2 0 002-1.6L21 8H6M9 21a1 1 0 100-2 1 1 0 000 2zM18 21a1 1 0 100-2 1 1 0 000 2z'},
  {id:'peso',     l:'PESO',     p:'M3 20h18M6 20V10M11 20V5M16 20v-8M21 20v-4'}
];
let cur = 'oggi';
document.getElementById('nav').innerHTML = TABS.map(t=>
  `<button id="tab-${t.id}" class="${t.id===cur?'on':''}" onclick="go('${t.id}')">
     <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="${t.p}"/></svg>
     <span>${t.l}</span>
   </button>`).join('');

function go(id){
  cur = id;
  TABS.forEach(t=>{
    document.getElementById('v-'+t.id).classList.toggle('on', t.id===id);
    document.getElementById('tab-'+t.id).classList.toggle('on', t.id===id);
  });
  window.scrollTo(0,0);
}
